<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">

    <title>小朋友情境問答遊戲</title>
    <style>

            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .game-container {
            background-color: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            padding: 30px;
            max-width: 800px;
            width: 100%;
            text-align: center;
        }
        h1 { color: #2c3e50; font-size: 28px; margin-bottom: 20px; }
        .group-selector {
            margin-bottom: 20px;
            padding: 10px;
            font-size: 18px;
            border-radius: 10px;
            border: 2px solid #3498db;
            background-color: #ebf5fb;
            cursor: pointer;
            width: 100%;
            max-width: 300px;
        }
        .flashcard {
            background-color: #fff;
            border: 3px solid #3498db;
            border-radius: 15px;
            padding: 40px 20px;
            margin: 20px 0;
            min-height: 150px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: transform 0.3s ease, background-color 0.3s ease;
        }
        .flashcard:hover {
            transform: scale(1.02);
            background-color: #f7fbff;
        }
        .question-text {
            font-size: 24px;
            color: #34495e;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .lang-label { font-size: 14px; color: #7f8c8d; margin-bottom: 5px; font-weight: normal; text-align: left; padding-left: 5%; }
        .text-content { margin-bottom: 20px; }
        .written { color: #2980b9; }
        .spoken { color: #16a085; }
        .answer-written { color: #c0392b; }
        .answer-spoken { color: #d35400; }
        .answer-text {
            font-size: 22px;
            color: #e74c3c;
            font-weight: bold;
            display: none;
            padding-top: 20px;
            border-top: 2px dashed #bdc3c7;
            width: 90%;
            margin: 0 auto;
        }
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        button {
            padding: 12px 25px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.2s;
            color: white;
        }
        .btn-prev { background-color: #95a5a6; }
        .btn-prev:hover { background-color: #7f8c8d; }
        .btn-next { background-color: #2ecc71; }
        .btn-next:hover { background-color: #27ae60; }
        .btn-speak { background-color: #f39c12; }
        .btn-speak:hover { background-color: #d35400; }
        .btn-show { background-color: #9b59b6; }
        .btn-show:hover { background-color: #8e44ad; }
        
        .progress {
            margin-top: 15px;
            color: #7f8c8d;
            font-size: 16px;
        }
    </style>
</head>
<body>

<div class="game-container">
    <h1>💡 小朋友情境問答遊戲</h1>
    
    <select class="group-selector" id="groupSelect" onchange="changeGroup()">
        <option value="wiseStudio">Wise studio (精選情境)</option>
        <option value="k2">幼稚園二年級 (K2)</option>
        <option value="k3">幼稚園三年級 (K3)</option>
        <option value="p1">小學一年級 (P1)</option>
    </select>

    <div class="flashcard" onclick="toggleAnswer()">
        <div class="question-text" id="questionText">載入中...</div>
        <div class="answer-text" id="answerText">載入中...</div>
    </div>

    <div class="controls">
        <button class="btn-prev" onclick="prevQuestion()">⬅️ 上一題</button>
        <button class="btn-speak" onclick="speakCurrent()">🔊 朗讀題目</button>
        <button class="btn-show" onclick="toggleAnswer()">👁️ 顯示/隱藏答案</button>
        <button class="btn-next" onclick="nextQuestion()">下一題 ➡️</button>
    </div>

    <div class="progress" id="progressText">第 1 / 1 題</div>
</div>

    let currentGroup = 'wiseStudio';
    let currentIndex = 0;
    let isAnswerShown = false;

    function init() {
        changeGroup();
    }

    function changeGroup() {
        const select = document.getElementById('groupSelect');
        currentGroup = select.value;
        currentIndex = 0;
        updateUI();
    }

    function updateUI() {
        const currentData = allData[currentGroup];
        const qText = document.getElementById('questionText');
        const aText = document.getElementById('answerText');
        const progress = document.getElementById('progressText');
        
        // 畫面只顯示書面語 (陣列索引 0 為書面語問題，2 為書面語答案)
        qText.innerText = currentData[currentIndex][0];
        aText.innerText = currentData[currentIndex][2];
        
        isAnswerShown = false;
        aText.style.display = 'none';
        
        progress.innerText = `第 ${currentIndex + 1} / ${currentData.length} 題`;
    }

    function toggleAnswer() {
        const aText = document.getElementById('answerText');
        isAnswerShown = !isAnswerShown;
        aText.style.display = isAnswerShown ? 'block' : 'none';
        
        if (isAnswerShown) {
            // 朗讀時跟足畫面顯示的書面語答案 (陣列索引 2)
            speakText(allData[currentGroup][currentIndex][2]);
        }
    }

    function nextQuestion() {
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        
        const currentData = allData[currentGroup];
        currentIndex++;
        if (currentIndex >= currentData.length) {
            currentIndex = 0;
            alert("太棒了！你已經完成這組所有 80 條題目，我們從頭再來一次吧！");
        }
        updateUI();
    }

    function prevQuestion() {
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        
        const currentData = allData[currentGroup];
        currentIndex--;
        if (currentIndex < 0) {
            currentIndex = currentData.length - 1;
        }
        updateUI();
    }

    function speakCurrent() {
        const currentData = allData[currentGroup][currentIndex];
        // 朗讀時跟足畫面顯示的書面語字眼 (陣列索引 0 為問題，2 為答案)
        const textToSpeak = isAnswerShown ? 
            `問題：${currentData[0]} 答案：${currentData[2]}` : 
            currentData[0];
        speakText(textToSpeak);
    }

    function speakText(text) {
        if (!('speechSynthesis' in window)) {
            alert("你的瀏覽器不支援語音功能，建議使用 Google Chrome 或 Safari。");
            return;
        }
        
        window.speechSynthesis.cancel();
        
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'zh-HK'; 
        
        // 語速維持較慢，方便小朋友聆聽
        utterance.rate = 0.8; 
        utterance.pitch = 1.0; 
        
        const voices = window.speechSynthesis.getVoices();
        
        // 嚴格篩選廣東話/香港語音，徹底排除普通話 (移除所有 zh-TW 或 zh-CN)
        const hkVoice = voices.find(v => 
            v.lang === 'zh-HK' || 
            v.lang === 'yue-HK' || 
            v.lang === 'zh_HK' ||
            v.name.includes('Cantonese') || 
            v.name.includes('Hong Kong') || 
            v.name.includes('Sin-ji') || // Apple 系統廣東話女聲
            v.name.includes('Danny') ||  // Apple 系統廣東話男聲
            v.name.includes('粤語') ||   // Google 系統廣東話
            v.name.includes('HK')
        );

        if (hkVoice) {
            utterance.voice = hkVoice;
        }
        
        window.speechSynthesis.speak(utterance);
    }

    if (speechSynthesis.onvoiceschanged !== undefined) {
        speechSynthesis.onvoiceschanged = function() {};
    }

    window.onload = init;
</script>
