<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>🌿 馮樂欣學英文 🌿 | 慢速拼讀 + 聽音遊戲 + 文章閱讀</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body {
            font-family: 'Quicksand', 'Segoe UI', sans-serif;
            background: linear-gradient(145deg, #c8e6c9 0%, #a5d6a7 100%);
            min-height: 100vh;
            display: flex; justify-content: center; align-items: center;
            padding: 16px 12px;
        }

        .game-container {
            max-width: 900px; width: 100%;
            background-color: #f1f9f0;
            border-radius: 60px;
            box-shadow: 0 20px 40px rgba(30, 90, 40, 0.25);
            overflow: hidden;
            border: 2px solid #6da56d;
        }

        .header {
            background: #2e7d5e; padding: 22px 20px; text-align: center; color: white; text-shadow: 2px 2px 0 #1b5e3f;
        }
        .header h1 { font-size: 2.2rem; font-weight: 700; }
        .header p {
            font-size: 1.1rem; font-weight: 600; background: #e8f5e9; display: inline-block;
            padding: 5px 18px; border-radius: 50px; color: #1e5631; margin-top: 8px;
        }

        .main-view { padding: 25px 24px 35px; }

        /* 按鈕共用樣式 */
        .btn {
            border: none; font-weight: 700; padding: 12px 22px; border-radius: 50px;
            font-size: 1.1rem; font-family: 'Quicksand', sans-serif; cursor: pointer;
            transition: 0.2s; display: inline-flex; align-items: center; gap: 8px;
        }
        .btn:active { transform: translateY(3px); }
        .btn-green { background: #388e3c; color: white; box-shadow: 0 5px 0 #1e5f22; }
        .btn-green:hover { background: #4caf50; }
        .btn-blue { background: #29b6f6; color: white; box-shadow: 0 5px 0 #0288d1; }
        .btn-blue:hover { background: #4fc3f7; }
        .btn-orange { background: #ffa726; color: white; box-shadow: 0 5px 0 #e65100; }
        .btn-orange:hover { background: #ffb74d; }
        .btn-light { background: #a5d6a7; color: #1e4620; border: 2px solid #6da56d; box-shadow: 0 4px 6px rgba(50, 100, 30, 0.2); }
        .btn-light:hover { background: #81c784; }
        .btn-outline { background: transparent; border: 3px solid #388e3c; color: #1d6b23; }
        .btn-pink { background: #ec407a; color: white; box-shadow: 0 5px 0 #ad1457; }
        .btn-pink:hover { background: #f06292; }
        .btn-outline-red { background: white; border: 3px solid #e57373; color: #d32f2f; }
        .btn-outline-red:hover { background: #ffebee; }

        /* 輸入區塊 */
        .input-area {
            background: #e8f5e9; border-radius: 40px; padding: 25px; margin-bottom: 20px; border: 2px dashed #4c9a5e;
        }
        .input-label { font-weight: 800; color: #1e5c27; font-size: 1.1rem; margin-bottom: 8px; display: block; }
        input[type="text"], textarea {
            width: 100%; border-radius: 20px; border: 2.5px solid #5fa06a; padding: 14px 18px;
            font-size: 1.1rem; font-family: 'Quicksand', sans-serif; background: #fcfff9;
            outline: none; color: #1e4620; font-weight: 600; margin-bottom: 15px; resize: vertical;
        }
        input[type="text"]:focus, textarea:focus { border-color: #2e7d5e; box-shadow: 0 0 0 4px #b9e6b9; }

        /* 群組管理 */
        .group-panel {
            background: #dcedc8; border-radius: 40px; padding: 20px; border: 1px solid #8bc34a; margin-bottom: 25px;
        }
        .group-badge {
            background: white; border-radius: 50px; padding: 8px 16px; margin: 6px;
            display: inline-flex; align-items: center; gap: 10px; box-shadow: 0 3px 6px #9fcc9f;
            border: 2px solid #7ab87a; cursor: pointer; transition: 0.2s;
        }
        .group-badge.active { background: #c8e6c9; border-color: #2e7d5e; box-shadow: 0 4px 10px rgba(46, 125, 94, 0.4); transform: scale(1.02); }
        .group-name { font-weight: 800; color: #1e5c27; }
        .del-group-btn {
            background: #ffebee; color: #c62828; border: none; border-radius: 50%; width: 26px; height: 26px;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
        }

        /* 字卡與文章共用 - 強化居中 */
        .flashcard {
            background: #f1f9ec; border-radius: 60px; padding: 30px 20px; text-align: center;
            box-shadow: inset 0 1px 6px #c8e6c9, 0 12px 20px rgba(30, 80, 30, 0.1); margin: 20px 0; border: 2px solid #a5d6a7;
            display: flex; flex-direction: column; align-items: center; 
        }
        .progress-tag {
            font-size: 1.3rem; background: #c8e6c9; display: inline-block; padding: 8px 22px;
            border-radius: 50px; font-weight: 700; color: #1e5631; border: 1px solid #6da56d; margin-bottom: 15px;
        }

        /* Phonics 學習專區 - 英文單字完美置中 */
        .english-word { 
            font-size: 2.8rem; font-weight: 800; color: #1d5e2b; margin: 10px auto 20px auto;
            background: #e2f0da; border-radius: 60px; padding: 14px 32px;
            box-shadow: 0 8px 0 #a3c2a3; cursor: pointer; transition: 0.1s;
            display: block; text-align: center; width: fit-content; max-width: 90%; line-height: 1.3;
        }
        .english-word:active { transform: translateY(4px); box-shadow: 0 4px 0 #a3c2a3; }

        .phonics-area { 
            background: #e2f0da; border-radius: 40px; padding: 20px; border: 3px dotted #6ea86e; margin-bottom: 20px; 
            width: 100%; text-align: center;
        }
        .phonics-chunk {
            display: inline-block; padding: 8px 16px; border-radius: 36px; font-size: 1.6rem; font-weight: 700;
            box-shadow: inset 0 1px 4px white, 0 3px 0 #5e9468; margin: 5px; cursor: pointer; border: 1.5px solid #87bf87;
        }
        .phonics-chunk:nth-child(even) { background: #fff9c4; color:#33691e; }
        .phonics-chunk:nth-child(odd) { background: #c5e1a5; color:#1b5e20; }

        /* 中文翻譯區塊 */
        .chinese-trans {
            font-size: 1.8rem; font-weight: 700; color: #1b5e20; background: #c8e6c9; padding: 12px 28px;
            border-radius: 60px; display: block; border: 2px solid #81c784; box-shadow: 0 4px 8px #c5e1a5;
            margin: 10px auto; text-align: center; width: fit-content; max-width: 90%; line-height: 1.4;
        }
        .chinese-trans span.cchar {
            cursor: pointer; transition: 0.1s; display: inline-block; padding: 0 2px; border-radius: 12px;
        }
        .chinese-trans span.cchar:hover { background: #fff9c4; transform: scale(1.05); }
        .chinese-trans span.char-plain { display: inline-block; }

        /* 文章閱讀專區 */
        .sentence-box {
            background: #eaf6ea; border-radius: 40px; padding: 25px; margin: 20px auto; border: 2px dashed #81c784; text-align: center; width: 100%;
        }
        .article-text { font-size: 2.2rem; font-weight: 700; color: #1d4a2c; line-height: 1.6; margin-bottom: 20px; text-align: center; }
        .word-span, .char-span { display: inline-block; padding: 0 4px; border-radius: 12px; cursor: pointer; transition: 0.1s; }
        .word-span:hover { background: #dcedc8; }
        .highlight { background: #f5e56b !important; color: #1e3a1e !important; box-shadow: 0 0 10px #b3b83e; font-weight: 800; }

        /* 遊戲專區 */
        .big-play-btn {
            font-size: 5rem; width: 140px; height: 140px; border-radius: 50%; background: #ffb74d; border: 5px solid #f57c00;
            color: white; cursor: pointer; margin: 15px auto; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 20px rgba(0,0,0,0.15);
        }
        .game-options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 25px; width: 100%; }
        .game-option-btn {
            background: white; border: 3px solid #81c784; border-radius: 25px; padding: 20px 15px; font-size: 2rem;
            font-weight: bold; color: #1b5e20; cursor: pointer; transition: 0.2s; box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }
        .game-option-btn.correct { background: #c8e6c9; border-color: #388e3c; }
        .game-option-btn.wrong { background: #ffcdd2; border-color: #d32f2f; animation: shake 0.5s; }

        /* 動畫與彈窗 */
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }
        .popup-banner {
            position: fixed; top: 40%; left: 50%; transform: translate(-50%, -50%); background: #f1f8e9;
            border-radius: 60px; padding: 25px 40px; text-align: center; z-index: 1000;
            box-shadow: 0 20px 40px rgba(40, 110, 30, 0.4); border: 5px solid #aed581; animation: bouncePop 0.4s ease;
        }
        .popup-banner h2 { color: #2e7d5e; font-size: 2.2rem; margin-bottom: 10px; }
        @keyframes bouncePop { 0% { opacity: 0; transform: translate(-50%, -50%) scale(0.8);} 100% { opacity: 1; transform: translate(-50%, -50%) scale(1);} }
        
        /* 響應式調整 */
        @media (max-width: 550px) {
            .english-word { font-size: 2.2rem; padding: 10px 20px; }
            .chinese-trans { font-size: 1.5rem; padding: 8px 20px; }
            .phonics-chunk { font-size: 1.2rem; padding: 6px 12px; }
        }
    </style>
</head>
<body>
<div class="game-container">
    <div class="header">
        <h1><i class="fas fa-leaf"></i> 馮樂欣學英文 <i class="fas fa-seedling"></i></h1>
        <p>🌱 智慧音節拼讀 + 聽音遊戲 + 文章閱讀 (幼幼友善) 🌱</p>
    </div>

    <div id="inputView" class="main-view">
        <div class="group-panel">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h3 style="color:#2e7d5e; margin: 0;"><i class="fas fa-tags"></i> 選擇學習群組：</h3>
                <button id="sortGroupsBtn" class="btn btn-outline" style="font-size: 0.9rem; padding: 6px 15px; border-radius: 20px;"><i class="fas fa-sort-alpha-down"></i> 群組排序</button>
            </div>
            <div id="groupManagerPanel" style="display:flex; flex-wrap:wrap; max-height:200px; overflow-y:auto;"></div>
        </div>

        <div class="input-area">
            <span class="input-label"><i class="fas fa-folder"></i> 群組名稱</span>
            <input type="text" id="groupNameInput" placeholder="例如: Unit 1 常用問候">

            <span class="input-label"><i class="fas fa-pen-fancy"></i> 英文單字或句子 (系統會自動拆分音節，也可手動加「.」微調)</span>
            <textarea id="wordInput" rows="2" placeholder="例如: apple, elephant, Good morning"></textarea>

            <span class="input-label"><i class="fas fa-book-open"></i> 專屬閱讀文章 (標題與內容)</span>
            <input type="text" id="articleTitleInput" placeholder="文章標題 (例如: My Morning)">
            <textarea id="articleContentInput" rows="3" placeholder="請輸入相關英文文章... 系統會自動切分為句子進行朗讀。"></textarea>
            
            <div style="display: flex; gap: 12px; margin-top: 15px; flex-wrap: wrap;">
                <button id="saveGroupBtn" class="btn btn-green"><i class="fas fa-save"></i> 更新目前群組</button>
                <button id="newGroupBtn" class="btn btn-light"><i class="fas fa-plus"></i> 新增為新群組</button>
            </div>
        </div>

        <div style="display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; margin-top: 30px; border-top: 2px dashed #a5d6a7; padding-top: 25px;">
            <button id="startTrainBtn" class="btn btn-light" style="background:#fff;"><i class="fas fa-graduation-cap"></i> 單字拼讀學習</button>
            <button id="startGameBtn" class="btn btn-orange"><i class="fas fa-gamepad"></i> 聽音選字遊戲</button>
            <button id="startArticleBtn" class="btn btn-blue"><i class="fas fa-book-reader"></i> 進入文章閱讀</button>
        </div>

        <div style="margin-top: 30px; text-align: center;">
            <button id="exportDataBtn" class="btn btn-outline" style="font-size: 0.9rem; padding: 8px 15px;">匯出 JSON</button>
            <button id="importDataBtn" class="btn btn-outline" style="font-size: 0.9rem; padding: 8px 15px;">匯入 JSON</button>
            <input type="file" id="importFileHidden" accept=".json" style="display: none;">
        </div>
    </div>

    <div id="trainingView" class="main-view" style="display: none;">
        <div style="text-align: center;"><span class="progress-tag" id="trainProgress">0 / 0</span></div>
        <div class="flashcard">
            <div class="english-word" id="currentWordTarget">Loading...</div>
            <button id="playPhonicsAudioBtn" class="btn btn-light" style="margin-bottom: 15px;"><i class="fas fa-volume-up"></i> 朗讀整句 (中英雙語・超慢速)</button>
            
            <div class="phonics-area" id="phonicsBlocksList"></div>
            
            <div style="margin-top: 15px; width: 100%; display: flex; justify-content: center;">
                <div class="chinese-trans" id="currentChineseTarget">翻譯載入中...</div>
            </div>
            <div style="margin-top: 12px; font-size: 0.9rem; color:#558b2f; text-align: center; width: 100%;">
                <i class="fas fa-hand-point-right"></i> 點一下英文單字：慢速英文發音 &nbsp;&nbsp; 點一下中文字：廣東話發音
            </div>
        </div>
        <div style="display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; margin-top: 20px;">
            <button class="btn btn-outline backToMainBtn"><i class="fas fa-home"></i> 返回</button>
            <button id="repeatSoundBtn" class="btn btn-light"><i class="fas fa-redo"></i> 重播</button>
            <button id="addToFavBtn" class="btn btn-pink"><i class="fas fa-heart"></i> 加入最愛</button>
            <button id="prevWordBtn" class="btn btn-blue"><i class="fas fa-arrow-left"></i> 上一個</button>
            <button id="nextWordBtn" class="btn btn-green">下一個 <i class="fas fa-arrow-right"></i></button>
        </div>
    </div>

    <div id="gameView" class="main-view" style="display: none;">
        <div style="text-align: center;"><span class="progress-tag" id="gameProgress">第一關：0 / 5</span></div>
        <div class="flashcard">
            <h3 style="color:#2e7d5e; margin-bottom:10px;">聽聲音，選出正確的句子！ (發音很慢)</h3>
            <div class="big-play-btn" id="playGameAudioBtn"><i class="fas fa-volume-up"></i></div>
            <div class="game-options-grid" id="gameOptionsContainer"></div>
        </div>
        <div style="display: flex; justify-content: center; margin-top: 20px;">
            <button class="btn btn-outline backToMainBtn"><i class="fas fa-home"></i> 結束遊戲</button>
        </div>
    </div>

    <div id="articleView" class="main-view" style="display: none;">
        <div style="text-align: center;"><span class="progress-tag" id="articleProgress">句子 0 / 0</span></div>
        <div class="flashcard" style="text-align: left; padding: 25px 20px; align-items: stretch;">
            <h2 id="articleReadTitle" style="text-align: center; color: #1e5a3c; margin-bottom: 15px;">文章標題</h2>
            
            <div class="sentence-box">
                <div class="article-text" id="articleEnSentence"></div>
                <div class="chinese-trans" id="articleCnSentence" style="font-size: 1.6rem; margin-top: 10px; width: auto;"></div>
            </div>

            <div style="display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; margin-top: 10px;">
                <button id="speakEnBtn" class="btn btn-light"><i class="fas fa-volume-up"></i> 慢速朗讀英文</button>
                <button id="speakCantoBtn" class="btn btn-light" style="background:#fff; border-color:#81c784;"><i class="fas fa-comment-dots"></i> 慢速朗讀廣東話</button>
            </div>
        </div>
        <div style="display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; margin-top: 20px;">
            <button class="btn btn-outline backToMainBtn"><i class="fas fa-home"></i> 返回主頁</button>
            <button id="prevArticleBtn" class="btn btn-light"><i class="fas fa-arrow-left"></i> 上一句</button>
            <button id="nextArticleBtn" class="btn btn-blue">下一句 <i class="fas fa-arrow-right"></i></button>
        </div>
    </div>
</div>

<script>
    (function() {
        // 超慢速語音參數
        const EXTRA_SLOW_EN_WORD = 0.55;      
        const EXTRA_SLOW_EN_SENTENCE = 0.62;  
        const EXTRA_SLOW_CANTONESE = 0.58;    
        
        let groups = [];
        let currentGroupId = null;

        const DEFAULT_GROUPS = [
            { id: 101, name: "1. 常用問候 (Greetings)", words: ["Good morning", "How are you?", "Nice to meet you"], articleTitle: "Morning Greeting", articleContent: "Good morning! How are you today? It is nice to meet you here. Have a nice day." },
            { id: 102, name: "2. 關於動物 (Animals)", words: ["The cat is sleeping", "I see an elephant", "Dogs are loyal"], articleTitle: "Animals in the Park", articleContent: "The cat is sleeping under the tree. Look, I see a big elephant! Dogs are loyal animals." }
        ];

        let trainingWords = []; let currentTrainIdx = 0;
        let isGaming = false; let gameWordsPool = []; let gameTargetWord = ""; let gameRoundCount = 0; let currentGameTargets = [];
        let articleSentences = []; let articleTranslations = []; let currentSentenceIdx = 0;

        const synth = window.speechSynthesis;

        function speakEnglish(text, onBoundary, onEnd, customRate) {
            if(!synth) return;
            synth.cancel();
            const cleanText = text.replace(/[^a-zA-Z0-9\s.,!?'"-]/g, '');
            if(!cleanText.trim()) return;
            const utter = new SpeechSynthesisUtterance(cleanText);
            utter.lang = 'en-GB';
            const voices = synth.getVoices();
            const ukVoice = voices.find(v => v.lang === 'en-GB' || v.lang.includes('en-GB') || v.name.includes('UK'));
            if(ukVoice) utter.voice = ukVoice;
            utter.rate = customRate; 
            if(onBoundary) utter.onboundary = onBoundary;
            if(onEnd) utter.onend = onEnd;
            synth.speak(utter);
        }

        function speakCantonese(text, onBoundary, onEnd, customRate) {
            if(!synth) return;
            synth.cancel();
            const utter = new SpeechSynthesisUtterance(text);
            utter.lang = 'zh-HK';
            const voices = synth.getVoices();
            const hkVoice = voices.find(v => v.lang === 'zh-HK' || v.lang === 'zh-YUE' || v.name.toLowerCase().includes('cantonese') || v.name.toLowerCase().includes('hong kong'));
            if(hkVoice) utter.voice = hkVoice;
            utter.rate = customRate;
            if(onBoundary) utter.onboundary = onBoundary;
            if(onEnd) utter.onend = onEnd;
            synth.speak(utter);
        }

        function playWordAndTranslationSlow(wordText, translationText) {
            speakEnglish(wordText, null, () => {
                setTimeout(() => {
                    speakCantonese(translationText, null, null, EXTRA_SLOW_CANTONESE);
                }, 800);  
            }, EXTRA_SLOW_EN_WORD);
        }

        // 自動音節拆分核心演算法
        function autoSyllableSplit(word) {
            // 1. 如果使用者有手動輸入點「.」，優先尊重手動設定
            if (word.includes('.')) return word.split('.'); 
            
            let orig = word;
            // 2. 基礎母音拆分正則表達式 (找尋 母音+子音 結構)
            let syllables = orig.match(/[^aeiouy]*[aeiouy]+(?:[^aeiouy]*$|[^aeiouy](?=[^aeiouy]))?/gi);
            if (!syllables) return [orig];
            
            // 3. 智慧修復：避免常見的英文組合字 (Digraphs) 被無情切斷
            for (let i = 0; i < syllables.length - 1; i++) {
                let current = syllables[i];
                let next = syllables[i+1];
                if (!current || !next) continue;
                
                let lastChar = current.slice(-1).toLowerCase();
                let firstCharNext = next.charAt(0).toLowerCase();
                let combined = lastChar + firstCharNext;
                
                // 像是 ch, sh, th, ph, wh 應該要連著後面的母音發音 (如 tea-cher, mo-ther)
                if (['ch', 'sh', 'th', 'ph', 'wh'].includes(combined)) {
                    syllables[i] = current.slice(0, -1);
                    syllables[i+1] = current.slice(-1) + next;
                } 
                // ck 通常是跟著前面的母音走 (如 back-pack)
                else if (combined === 'ck') {
                    syllables[i] = current + firstCharNext;
                    syllables[i+1] = next.slice(1);
                }
            }
            return syllables.filter(s => s.trim().length > 0);
        }

        function renderChineseAsClickableChars(container, chineseText) {
            if(!container) return;
            container.innerHTML = '';
            if(!chineseText) { container.innerText = '翻譯內容'; return; }
            for(let i = 0; i < chineseText.length; i++) {
                const ch = chineseText[i];
                const isChinese = /[一-鿿]/.test(ch);
                const span = document.createElement('span');
                if(isChinese) {
                    span.className = 'cchar'; span.innerText = ch;
                    span.onclick = (e) => { e.stopPropagation(); speakCantonese(ch, null, null, EXTRA_SLOW_CANTONESE); };
                } else {
                    span.className = 'char-plain'; span.innerText = ch;
                }
                container.appendChild(span);
            }
        }

        // 儲存與群組邏輯
        function loadGroups() {
            const saved = localStorage.getItem('欣欣學英文_完整整合版');
            if(saved) { try { groups = JSON.parse(saved); } catch(e) { groups = [...DEFAULT_GROUPS]; } } else { groups = [...DEFAULT_GROUPS]; }
            if(groups.length > 0) currentGroupId = groups[0].id;
            renderGroupPanels(); selectGroup(currentGroupId);
        }
        function saveGroups() { localStorage.setItem('欣欣學英文_完整整合版', JSON.stringify(groups)); }
        function renderGroupPanels() {
            const container = document.getElementById('groupManagerPanel'); container.innerHTML = '';
            groups.forEach(g => {
                const badge = document.createElement('div'); badge.className = 'group-badge' + (g.id === currentGroupId ? ' active' : '');
                const title = document.createElement('span'); title.className = 'group-name'; title.innerText = g.name; title.onclick = () => selectGroup(g.id);
                const delBtn = document.createElement('button'); delBtn.className = 'del-group-btn'; delBtn.innerHTML = '<i class="fas fa-times"></i>';
                delBtn.onclick = (e) => {
                    e.stopPropagation();
                    if(confirm(`確定刪除「${g.name}」群組嗎？`)) {
                        groups = groups.filter(item => item.id !== g.id);
                        if(groups.length > 0) currentGroupId = groups[0].id; else currentGroupId = null;
                        saveGroups(); renderGroupPanels(); selectGroup(currentGroupId);
                    }
                };
                badge.appendChild(title); badge.appendChild(delBtn); container.appendChild(badge);
            });
        }
        function selectGroup(id) {
            currentGroupId = id; renderGroupPanels(); 
            const group = groups.find(g => g.id === id);
            if(group) {
                document.getElementById('groupNameInput').value = group.name || '';
                document.getElementById('wordInput').value = (group.words || []).join(', ');
                document.getElementById('articleTitleInput').value = group.articleTitle || '';
                document.getElementById('articleContentInput').value = group.articleContent || '';
            } else {
                document.getElementById('groupNameInput').value = ''; document.getElementById('wordInput').value = '';
                document.getElementById('articleTitleInput').value = ''; document.getElementById('articleContentInput').value = '';
            }
        }

        document.getElementById('sortGroupsBtn').onclick = () => {
            if(groups.length <= 1) return;
            groups.sort((a, b) => a.name.localeCompare(b.name, 'zh-Hant'));
            saveGroups(); renderGroupPanels(); showPopup("🔤 排序完成！", "群組已依名稱順序排列。");
        };
        document.getElementById('saveGroupBtn').onclick = () => {
            if(!currentGroupId && groups.length === 0) return document.getElementById('newGroupBtn').click();
            const group = groups.find(g => g.id === currentGroupId);
            if(group) {
                group.name = document.getElementById('groupNameInput').value.trim() || '未命名群組';
                group.words = document.getElementById('wordInput').value.split(',').map(w=>w.trim()).filter(w=>w);
                group.articleTitle = document.getElementById('articleTitleInput').value.trim();
                group.articleContent = document.getElementById('articleContentInput').value.trim();
                saveGroups(); renderGroupPanels(); showPopup("💾 儲存成功！", "群組內容已更新。");
            }
        };
        document.getElementById('newGroupBtn').onclick = () => {
            const newId = Date.now();
            groups.push({
                id: newId, name: document.getElementById('groupNameInput').value.trim() || '新群組',
                words: document.getElementById('wordInput').value.split(',').map(w=>w.trim()).filter(w=>w),
                articleTitle: document.getElementById('articleTitleInput').value.trim(),
                articleContent: document.getElementById('articleContentInput').value.trim()
            });
            currentGroupId = newId; saveGroups(); renderGroupPanels(); selectGroup(newId); showPopup("✨ 新增成功！", "已建立全新學習群組。");
        };

        async function fetchTranslation(text) {
            try {
                const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=zh-TW&dt=t&q=${encodeURIComponent(text)}`);
                const data = await res.json(); return data[0].map(item => item[0]).join('');
            } catch(e) { return "點擊發音學習"; }
        }
        function showPopup(title, sub) {
            const pop = document.createElement('div'); pop.className = 'popup-banner';
            pop.innerHTML = `<h2>${title}</h2><p style="font-weight:600; font-size:1.2rem; color:#1e5c27;">${sub}</p>`;
            document.body.appendChild(pop); setTimeout(() => pop.remove(), 1800);
        }
        function switchView(viewId) {
            ['inputView', 'trainingView', 'gameView', 'articleView'].forEach(id => { document.getElementById(id).style.display = (id === viewId) ? 'block' : 'none'; });
        }
        document.querySelectorAll('.backToMainBtn').forEach(btn => { btn.onclick = () => { synth.cancel(); isGaming = false; switchView('inputView'); }; });

        // ========== 模式一：字卡拼讀 ==========
        function updateFavBtnUI(rawWord) {
            const favBtn = document.getElementById('addToFavBtn');
            let favGroup = groups.find(g => g.name === "❤️ 我的最愛");
            if (favGroup && favGroup.words.includes(rawWord)) {
                favBtn.innerHTML = '<i class="fas fa-eraser"></i> 移除最愛'; favBtn.className = 'btn btn-outline-red';
            } else {
                favBtn.innerHTML = '<i class="fas fa-heart"></i> 加入最愛'; favBtn.className = 'btn btn-pink';
            }
        }

        document.getElementById('startTrainBtn').onclick = () => {
            const group = groups.find(g => g.id === currentGroupId);
            if(!group || group.words.length === 0) return alert("目前群組沒有單字，請先輸入！");
            trainingWords = group.words; currentTrainIdx = 0; switchView('trainingView'); loadFlashcard(currentTrainIdx);
        };

        async function loadFlashcard(idx) {
            if(idx >= trainingWords.length) {
                showPopup("🎉 太棒了！", "妳已經完成本組單字的學習！");
                setTimeout(() => switchView('inputView'), 2000); return;
            }
            document.getElementById('trainProgress').innerText = `${idx + 1} / ${trainingWords.length}`;
            
            const rawWord = trainingWords[idx]; 
            const cleanWord = rawWord.replace(/\./g, ''); 
            
            const wordElement = document.getElementById('currentWordTarget');
            wordElement.innerText = cleanWord;
            wordElement.onclick = () => speakEnglish(cleanWord, null, null, EXTRA_SLOW_EN_WORD);
            updateFavBtnUI(rawWord);
            
            // 啟用全新的自動音節拆分
            const phonicsContainer = document.getElementById('phonicsBlocksList');
            phonicsContainer.innerHTML = '';
            
            rawWord.split(/(\s+|[,!?])/).forEach(token => {
                if(!token || /^\s+$/.test(token) || /^[,!?]$/.test(token)) return;
                
                // 套用智慧拆分演算法
                const chunks = autoSyllableSplit(token);
                
                chunks.forEach(c => {
                    const cleanC = c.replace(/[^a-zA-Z-']/g, ''); 
                    if(!cleanC) return;
                    const span = document.createElement('span');
                    span.className = 'phonics-chunk';
                    span.innerText = c;
                    span.onclick = () => speakEnglish(cleanC, null, null, EXTRA_SLOW_EN_WORD); 
                    phonicsContainer.appendChild(span);
                });
            });

            const transTarget = document.getElementById('currentChineseTarget');
            transTarget.innerText = "翻譯中...";
            const translatedText = await fetchTranslation(cleanWord);
            if(trainingWords[currentTrainIdx] === rawWord) {
                renderChineseAsClickableChars(transTarget, translatedText);
            }
        }

        document.getElementById('playPhonicsAudioBtn').onclick = () => {
            const cleanWord = trainingWords[currentTrainIdx].replace(/\./g, '');
            const transElem = document.getElementById('currentChineseTarget');
            let transText = transElem.innerText;
            if(transText === "翻譯中..." || !transText) transText = "學習單字";
            playWordAndTranslationSlow(cleanWord, transText);
        };
        document.getElementById('repeatSoundBtn').onclick = () => document.getElementById('playPhonicsAudioBtn').click();
        
        document.getElementById('addToFavBtn').onclick = () => {
            const rawWord = trainingWords[currentTrainIdx];
            if (!rawWord) return;
            let favGroup = groups.find(g => g.name === "❤️ 我的最愛");
            let isFavorite = favGroup && favGroup.words.includes(rawWord);
            if (isFavorite) {
                favGroup.words = favGroup.words.filter(w => w !== rawWord);
                saveGroups(); renderGroupPanels(); showPopup("✨ 成功解鎖！", "小朋友太棒了，已經記住這個單字囉！");
                if (groups.find(g => g.id === currentGroupId) && groups.find(g => g.id === currentGroupId).name === "❤️ 我的最愛") {
                    trainingWords = favGroup.words;
                    if (trainingWords.length === 0) { setTimeout(() => { showPopup("🎉 恭喜過關！", "最愛清單的單字都學會囉！"); switchView('inputView'); }, 1800); return; }
                    if (currentTrainIdx >= trainingWords.length) currentTrainIdx = Math.max(0, trainingWords.length - 1);
                    setTimeout(() => loadFlashcard(currentTrainIdx), 500);
                } else { updateFavBtnUI(rawWord); }
            } else {
                if (!favGroup) { favGroup = { id: Date.now() + 999, name: "❤️ 我的最愛", words: [], articleTitle: "我的最愛單字", articleContent: "These are my favorite words." }; groups.unshift(favGroup); }
                if (!favGroup.words.includes(rawWord)) { favGroup.words.push(rawWord); saveGroups(); renderGroupPanels(); showPopup("💖 已加入最愛！", "可以在主選單複習喔！"); }
                updateFavBtnUI(rawWord);
            }
        };
        
        document.getElementById('prevWordBtn').onclick = () => { 
            if (currentTrainIdx > 0) { 
                currentTrainIdx--; 
                loadFlashcard(currentTrainIdx); 
            } else {
                showPopup("💡 提示", "這已經是第一個單字囉！");
            }
        };
        
        document.getElementById('nextWordBtn').onclick = () => { currentTrainIdx++; loadFlashcard(currentTrainIdx); };

        // ========== 模式二：聽音遊戲 ==========
        document.getElementById('startGameBtn').onclick = () => {
            const group = groups.find(g => g.id === currentGroupId);
            if(!group || group.words.length < 2) return alert("需要至少 2 個以上的單字才能玩遊戲喔！");
            gameWordsPool = group.words; currentGameTargets = [...group.words].sort(() => Math.random() - 0.5);
            isGaming = true; gameRoundCount = 0; switchView('gameView'); generateGameRound();
        };
        function generateGameRound() {
            const totalRounds = currentGameTargets.length;
            if(gameRoundCount >= totalRounds) { isGaming = false; showPopup("🏆 闖關成功！", `恭喜妳通過 ${totalRounds} 關挑戰！`); setTimeout(() => switchView('inputView'), 2000); return; }
            document.getElementById('gameProgress').innerText = `第 ${gameRoundCount + 1} 關 / 共 ${totalRounds} 關`;
            
            gameTargetWord = currentGameTargets[gameRoundCount];
            const cleanTargetWord = gameTargetWord.replace(/\./g, ''); 
            
            let options = [gameTargetWord];
            let distractors = gameWordsPool.filter(w => w !== gameTargetWord).sort(() => Math.random() - 0.5);
            options.push(...distractors.slice(0, 3)); options.sort(() => Math.random() - 0.5);
            
            const container = document.getElementById('gameOptionsContainer'); container.innerHTML = '';
            options.forEach(text => {
                const btn = document.createElement('button'); btn.className = 'game-option-btn'; 
                btn.innerText = text.replace(/\./g, ''); 
                btn.onclick = () => {
                    if(!isGaming || btn.classList.contains('correct') || btn.classList.contains('wrong')) return;
                    if(text === gameTargetWord) {
                        btn.classList.add('correct'); showPopup("⭐ 答對了！", "聽力一級棒！");
                        isGaming = false; setTimeout(() => { gameRoundCount++; isGaming = true; generateGameRound(); }, 1500);
                    } else { btn.classList.add('wrong'); setTimeout(() => btn.classList.remove('wrong'), 500); }
                };
                container.appendChild(btn);
            });
            setTimeout(() => speakEnglish(cleanTargetWord, null, null, EXTRA_SLOW_EN_WORD), 400); 
        }
        document.getElementById('playGameAudioBtn').onclick = () => { if(isGaming) speakEnglish(gameTargetWord.replace(/\./g, ''), null, null, EXTRA_SLOW_EN_WORD); };

        // ========== 模式三：文章閱讀 ==========
        document.getElementById('startArticleBtn').onclick = () => {
            const group = groups.find(g => g.id === currentGroupId);
            if(!group || !group.articleContent) return alert('請先在主頁輸入「專屬閱讀文章」內容！');
            articleSentences = group.articleContent.match(/[^.!?]+[.!?]+/g) || [group.articleContent];
            articleSentences = articleSentences.map(s => s.trim()).filter(s => s);
            if(articleSentences.length === 0) return;
            articleTranslations = new Array(articleSentences.length).fill('');
            currentSentenceIdx = 0; document.getElementById('articleReadTitle').innerText = group.articleTitle || group.name;
            switchView('articleView'); loadArticleSentence();
        };
        async function loadArticleSentence() {
            const sentence = articleSentences[currentSentenceIdx];
            document.getElementById('articleProgress').innerText = `句子 ${currentSentenceIdx + 1} / ${articleSentences.length}`;
            const enBox = document.getElementById('articleEnSentence'); enBox.innerHTML = '';
            const words = sentence.split(/(\s+)/); let charOffset = 0; const wordSpansData = [];
            words.forEach(w => {
                if(/^\s+$/.test(w)) { enBox.appendChild(document.createTextNode(w)); charOffset += w.length; } 
                else {
                    const span = document.createElement('span'); span.className = 'word-span'; span.innerText = w;
                    span.onclick = () => speakEnglish(w.replace(/[^a-zA-Z]/g, ''), null, null, EXTRA_SLOW_EN_WORD);
                    enBox.appendChild(span); wordSpansData.push({ span: span, start: charOffset, end: charOffset + w.length }); charOffset += w.length;
                }
            });
            enBox.wordSpansData = wordSpansData;
            const cnBox = document.getElementById('articleCnSentence'); cnBox.innerText = '翻譯載入中...';
            if(!articleTranslations[currentSentenceIdx]) articleTranslations[currentSentenceIdx] = await fetchTranslation(sentence);
            renderChineseAsClickableChars(cnBox, articleTranslations[currentSentenceIdx]);
        }
        document.getElementById('speakEnBtn').onclick = () => {
            const sentence = articleSentences[currentSentenceIdx];
            const wordSpansData = document.getElementById('articleEnSentence').wordSpansData;
            document.querySelectorAll('.word-span, .char-span').forEach(s => s.classList.remove('highlight'));
            speakEnglish(sentence, (e) => { if(e.name === 'word') { const charIndex = e.charIndex; wordSpansData.forEach(item => { if(charIndex >= item.start && charIndex < item.end) { document.querySelectorAll('.word-span').forEach(s => s.classList.remove('highlight')); item.span.classList.add('highlight'); } }); } }, () => { document.querySelectorAll('.word-span').forEach(s => s.classList.remove('highlight')); }, EXTRA_SLOW_EN_SENTENCE);
        };
        document.getElementById('speakCantoBtn').onclick = () => {
            const text = articleTranslations[currentSentenceIdx]; if(!text) return;
            const cnChars = document.getElementById('articleCnSentence').querySelectorAll('.cchar');
            document.querySelectorAll('.word-span, .char-span').forEach(s => s.classList.remove('highlight'));
            speakCantonese(text, (e) => { if(e.name === 'word' || e.name === 'character') { if(cnChars[e.charIndex]) { document.querySelectorAll('.char-span').forEach(s => s.classList.remove('highlight')); cnChars[e.charIndex].classList.add('highlight'); } } }, () => { document.querySelectorAll('.char-span').forEach(s => s.classList.remove('highlight')); }, EXTRA_SLOW_CANTONESE);
        };
        document.getElementById('prevArticleBtn').onclick = () => { if(currentSentenceIdx > 0) { currentSentenceIdx--; loadArticleSentence(); } };
        document.getElementById('nextArticleBtn').onclick = () => { if(currentSentenceIdx < articleSentences.length - 1) { currentSentenceIdx++; loadArticleSentence(); } else { showPopup("📖 閱讀完畢！", "做得太棒了！"); setTimeout(() => switchView('inputView'), 2000); } };

        // 匯出匯入
        document.getElementById('exportDataBtn').onclick = () => { const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(groups, null, 2)); const dl = document.createElement('a'); dl.setAttribute("href", dataStr); dl.setAttribute("download", "欣欣英文群組資料.json"); document.body.appendChild(dl); dl.click(); dl.remove(); };
        const fileHidden = document.getElementById('importFileHidden'); document.getElementById('importDataBtn').onclick = () => fileHidden.click();
        fileHidden.onchange = (e) => { const file = e.target.files[0]; if(!file) return; const reader = new FileReader(); reader.onload = (evt) => { try { const parsed = JSON.parse(evt.target.result); if(Array.isArray(parsed)) { groups = parsed; currentGroupId = groups[0]?.id; saveGroups(); renderGroupPanels(); selectGroup(currentGroupId); showPopup("📂 匯入成功！", "資料已更新。"); } } catch(err) { alert('JSON 格式錯誤！'); } }; reader.readAsText(file); };

        window.onload = () => loadGroups();
        window.onbeforeunload = () => synth.cancel();
    })();
</script>
</body>
</html>
