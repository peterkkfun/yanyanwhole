                { text: "一隻荷包蛋", isCorrect: false, rationale: "煎好的蛋沒有生命，不能用「隻」。" },
                { text: "一本荷包蛋", isCorrect: false, rationale: "荷包蛋不是書。" }
            ]
        }, {
            question: "大掃除時，我幫忙丟了「一（ ）垃圾」。",
            hint: "裝在塑膠袋裡、或是堆在一起的事物，會用哪個字？",
            emoji: "🗑️",
            options: [
                { text: "一包垃圾", isCorrect: true, rationale: "裝在袋子裡的物品通常用「包」，如果散落在地上則可能用「堆」。" },
                { text: "一隻垃圾", isCorrect: false, rationale: "垃圾不是動物喔。" },
                { text: "一朵垃圾", isCorrect: false, rationale: "垃圾不是花。" },
                { text: "一張垃圾", isCorrect: false, rationale: "除非是一張廢紙，否則整袋垃圾不用「張」。" }
            ]
        }];

        let currentQuestionIndex = 0;
        let score = 0;
        let answered = false;

        const appDiv = document.getElementById('app');

        const synth = window.speechSynthesis;
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new AudioContext();
            }
        }

        function playCorrectSound() {
            initAudio();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            osc.type = 'sine';
            osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
            osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1);

            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);

            osc.start(audioCtx.currentTime);
            osc.stop(audioCtx.currentTime + 0.5);
        }

        function playIncorrectSound() {
            initAudio();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            osc.type = 'triangle';
            osc.frequency.setValueAtTime(300, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.3);

            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);

            osc.start(audioCtx.currentTime);
            osc.stop(audioCtx.currentTime + 0.3);
        }

        function stripEmoji(text) {
            return text.replace(
                    /([\u2700-\u27BF]|[\uE000-\uF8FF]|\uD83C[\uDC00-\uDFFF]|\uD83D[\uDC00-\uDFFF]|[\u2011-\u26FF]|\uD83E[\uDD10-\uDDFF])/g,
                    '')
                .replace(/（\s*）/g, '乜嘢')
                .replace(/\(\s*\)/g, '乜嘢');
        }

        function speakCantonese(text) {
            if (synth.speaking) synth.cancel();
            const cleanText = stripEmoji(text);
            const utterThis = new SpeechSynthesisUtterance(cleanText);
            utterThis.lang = 'zh-HK';
            utterThis.rate = 0.85;
            const voices = synth.getVoices();
            const hkVoice = voices.find(v => v.lang === 'zh-HK' || v.lang === 'yue-HK');
            if (hkVoice) {
                utterThis.voice = hkVoice;
            }
            synth.speak(utterThis);
        }

        function renderStartScreen() {
            appDiv.innerHTML = `
                <div class="p-10 text-center bg-bgLight">
                    <h1 class="text-4xl font-cute font-bold text-textDark mb-4">🌟 生活量詞趣味小測驗 🌟</h1>
                    <p class="text-lg text-gray-700 mb-8 font-sans">一起來挑戰看看，你能不能幫小動物和物品找到正確的「量詞」朋友吧！<br><span class="text-primary font-bold mt-2 inline-block">（🔥 終極大挑戰：共 50 題！）</span></p>
                    <div class="text-6xl mb-8">🏫🐈🍎✏️</div>
                    <button onclick="initAudio(); startQuiz(); speakCantonese('準備好未？我哋開始喇！');" class="bg-primary hover:bg-orange-500 text-white font-cute font-bold py-4 px-8 rounded-full text-2xl shadow-lg transform transition hover:scale-105 active:scale-95">
                        開始挑戰！ 🚀
                    </button>
                </div>
            `;
        }

        function startQuiz() {
            currentQuestionIndex = 0;
            score = 0;
            renderQuestion();
        }

        function renderQuestion() {
            answered = false;
            const q = quizData[currentQuestionIndex];
            const progress = ((currentQuestionIndex) / quizData.length) * 100;

            let optionsHtml = '';
            q.options.forEach((opt, index) => {
                optionsHtml += `
                    <div class="relative mb-3">
                        <button id="opt-${index}" onclick="handleAnswer(${index})" class="option-btn w-full text-left p-4 rounded-xl border-2 border-gray-200 bg-gray-50 hover:bg-blue-50 font-sans text-lg font-medium text-textDark pr-14">
                            <span class="inline-block w-8 h-8 rounded-full bg-white border border-gray-300 text-center leading-8 mr-3 font-bold">${String.fromCharCode(65 + index)}</span>
                            ${opt.text}
                        </button>
                        <button onclick="speakCantonese('${opt.text}')" class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-blue-500 transition p-2 bg-white rounded-full shadow-sm hover:bg-blue-50 z-10" title="讀出選項">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" /></svg>
                        </button>
                    </div>
                `;
            });

            appDiv.innerHTML = `
                <div class="bg-secondary h-3 w-full">
                    <div class="bg-primary h-3 transition-all duration-500" style="width: ${progress}%"></div>
                </div>
                <div class="p-6 md:p-10 slide-up">
                    <div class="flex justify-between items-center mb-6">
                        <span class="text-gray-500 font-bold font-sans">第 ${currentQuestionIndex + 1} / ${quizData.length} 題</span>
                        <span class="text-secondary font-bold font-sans">⭐ 分數: ${score}</span>
                    </div>

                    <div class="flex items-center gap-4 mb-6 relative">
                        <div class="text-5xl bg-bgLight p-4 rounded-2xl flex-shrink-0">${q.emoji}</div>
                        <h2 class="text-2xl md:text-3xl font-cute font-bold text-textDark leading-snug pr-12">${q.question}</h2>
                        <button onclick="speakCantonese('${q.question.replace(/'/g, "\\'")}')" class="absolute right-0 top-1/2 transform -translate-y-1/2 bg-blue-100 hover:bg-blue-200 text-blue-600 p-3 rounded-full shadow-sm transition active:scale-90" title="讀出題目">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" /></svg>
                        </button>
                    </div>

                    <div class="mb-6">
                        <button onclick="toggleHint()" class="text-sm font-bold text-secondary flex items-center hover:text-teal-600 transition">
                            💡 需要一點小提示嗎？
                        </button>
                        <div id="hint-box" class="hidden mt-2 p-3 bg-yellow-50 border border-yellow-200 rounded-lg text-sm text-yellow-800 font-sans relative">
                            <span class="pr-10 block">${q.hint}</span>
                            <button onclick="speakCantonese('${q.hint.replace(/'/g, "\\'")}')" class="absolute right-2 top-1/2 transform -translate-y-1/2 bg-yellow-200 hover:bg-yellow-300 text-yellow-700 p-2 rounded-full transition active:scale-90" title="讀出提示">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" /></svg>
                            </button>
                        </div>
                    </div>

                    <div id="options-container" class="mt-4">
                        ${optionsHtml}
                    </div>

                    <div id="feedback-container" class="hidden mt-6 p-5 rounded-2xl">
                    </div>

                    <div class="mt-6 flex justify-end">
                        <button id="next-btn" onclick="nextQuestion()" class="hidden bg-secondary hover:bg-teal-500 text-white font-cute font-bold py-3 px-8 rounded-full text-xl shadow-md transition">
                            ${currentQuestionIndex === quizData.length - 1 ? '看成績 🏆' : '下一題 ➡️'}
                        </button>
                    </div>
                </div>
            `;
        }

        function toggleHint() {
            const hintBox = document.getElementById('hint-box');
            hintBox.classList.toggle('hidden');
        }

        function handleAnswer(selectedIndex) {
            if (answered) return;
            answered = true;

            const q = quizData[currentQuestionIndex];
            const isCorrect = q.options[selectedIndex].isCorrect;
            const optionsContainer = document.getElementById('options-container');
            // *** 修復關鍵：只選取帶有 .option-btn 類別的按鈕，避免誤抓朗讀按鈕 ***
            const buttons = optionsContainer.querySelectorAll('.option-btn');

            buttons.forEach(btn => {
                btn.disabled = true;
                btn.classList.remove('hover:bg-blue-50', 'hover:scale-102');
                btn.classList.add('opacity-70', 'cursor-not-allowed');
            });

            buttons.forEach((btn, idx) => {
                const opt = q.options[idx];
                const letterSpan = btn.querySelector('span');

                if (opt.isCorrect) {
                    btn.classList.remove('bg-gray-50', 'border-gray-200');
                    btn.classList.add('bg-green-100', 'border-green-400', 'text-green-800', 'opacity-100',
                        'ring-2', 'ring-green-400', 'ring-offset-2');
                    letterSpan.classList.add('bg-green-500', 'text-white', 'border-none');
                } else if (idx === selectedIndex && !isCorrect) {
                    btn.classList.remove('bg-gray-50', 'border-gray-200');
                    btn.classList.add('bg-red-100', 'border-red-400', 'text-red-800', 'opacity-100');
                    letterSpan.classList.add('bg-red-500', 'text-white', 'border-none');
                }
            });

            if (isCorrect) score += 10;

            const correctPhrases = ["答對喇！好叻啊！", "好犀利啊！完全正確！", "真係聰明！", "好棒啊！繼續努力！"];
            const incorrectPhrases = ["唔緊要，差少少咋，睇下點解啦！", "哎呀，爭少少，下次一定得！", "唔怕，我哋一齊學！"];

            if (isCorrect) {
                playCorrectSound();
                const randomMsg = correctPhrases[Math.floor(Math.random() * correctPhrases.length)];
                setTimeout(() => speakCantonese(randomMsg), 300);
            } else {
                playIncorrectSound();
                const randomMsg = incorrectPhrases[Math.floor(Math.random() * incorrectPhrases.length)];
                setTimeout(() => speakCantonese(randomMsg), 300);
            }

            const feedbackContainer = document.getElementById('feedback-container');
            const rationale = q.options[selectedIndex].rationale;

            feedbackContainer.classList.remove('hidden');
            if (isCorrect) {
                feedbackContainer.classList.add('bg-green-50', 'border', 'border-green-200');
                feedbackContainer.innerHTML = `
                    <div class="flex items-start gap-3">
                        <div class="text-3xl">✅</div>
                        <div>
                            <h3 class="text-xl font-cute font-bold text-green-700 mb-1">太棒了，答對囉！</h3>
                            <p class="text-green-900 font-sans">${rationale}</p>
                        </div>
                    </div>
                `;
            } else {
                feedbackContainer.classList.add('bg-red-50', 'border', 'border-red-200');
                feedbackContainer.innerHTML = `
                    <div class="flex items-start gap-3">
                        <div class="text-3xl">❌</div>
                        <div>
                            <h3 class="text-xl font-cute font-bold text-red-700 mb-1">哎呀，有點可惜！</h3>
                            <p class="text-red-900 font-sans">${rationale}</p>
                        </div>
                    </div>
                `;
            }

            // Show next button and scroll it into view
            const nextBtn = document.getElementById('next-btn');
            nextBtn.classList.remove('hidden');
            nextBtn.classList.add('fade-in');
            setTimeout(() => {
                nextBtn.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, 150);
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < quizData.length) {
                renderQuestion();
                appDiv.scrollIntoView({ behavior: 'smooth', block: 'start' });
            } else {
                renderResultScreen();
            }
        }

        function renderResultScreen() {
            const maxScore = quizData.length * 10;
            let message = "";
            let emoji = "";

            if (score === maxScore) {
                message = "太厲害了！你是量詞小大師！ 🎉";
                emoji = "🏆";
            } else if (score >= maxScore * 0.7) {
                message = "表現得很棒喔！繼續加油！ 👍";
                emoji = "🌟";
            } else {
                message = "多練習幾次，你一定會越來越進步的！ 💪";
                emoji = "🌱";
            }

            appDiv.innerHTML = `
                <div class="p-10 text-center bg-bgLight slide-up">
                    <div class="text-7xl mb-4">${emoji}</div>
                    <h1 class="text-4xl font-cute font-bold text-textDark mb-4">測驗結束！</h1>
                    <div class="bg-white rounded-2xl p-6 shadow-sm inline-block mb-6 border-2 border-dashed border-primary">
                        <p class="text-lg text-gray-500 font-sans mb-1">你的總分是</p>
                        <p class="text-5xl font-bold text-primary font-cute">${score} <span class="text-2xl text-gray-400">/ ${maxScore}</span></p>
                    </div>
                    <p class="text-xl text-gray-800 font-sans mb-8 font-bold">${message}</p>
                    <button onclick="startQuiz()" class="bg-secondary hover:bg-teal-600 text-white font-cute font-bold py-3 px-8 rounded-full text-xl shadow-md transition mx-2 my-2">
                        再玩一次 🔄
                    </button>
                </div>
            `;
        }

        renderStartScreen();
    </script>
</body>
</html>
