<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>🌟 欣欣學習樂園 · 遊戲總匯 🌟</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background: linear-gradient(145deg, #fff5e6 0%, #ffe0c4 100%);
            font-family: 'Quicksand', 'Comic Neue', 'Segoe UI', system-ui, sans-serif;
            padding: 20px 18px 40px;
            min-height: 100vh;
        }
        /* 雲朵背景裝飾 */
        body::before {
            content: "☁️☁️☁️";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            font-size: 130px;
            white-space: nowrap;
            opacity: 0.04;
            letter-spacing: 60px;
            transform: rotate(5deg);
            z-index: 0;
        }
        .container {
            max-width: 1300px;
            margin: 0 auto;
            position: relative;
            z-index: 2;
        }
        /* 頭部區 */
        .hero {
            text-align: center;
            margin-bottom: 40px;
            background: rgba(255, 250, 240, 0.75);
            backdrop-filter: blur(12px);
            border-radius: 70px;
            padding: 28px 20px;
            box-shadow: 0 20px 35px rgba(150, 80, 20, 0.15), inset 0 1px 4px white;
            border: 2px solid #fff1d6;
        }
        .hero h1 {
            font-size: 2.7rem;
            font-weight: 800;
            background: linear-gradient(135deg, #f97316, #f59e0b, #eab308);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            text-shadow: 3px 3px 10px rgba(0,0,0,0.05);
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }
        .hero h1 i {
            background: none;
            color: #ffb347;
            text-shadow: none;
        }
        .hero p {
            font-size: 1.25rem;
            font-weight: 600;
            color: #c06b2a;
            background: #ffefdb;
            display: inline-block;
            padding: 8px 28px;
            border-radius: 40px;
            box-shadow: inset 0 1px 4px #ffe2bb, 0 4px 6px rgba(0,0,0,0.03);
        }
        /* 分類篩選按鈕 */
        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin-bottom: 40px;
        }
        .filter-btn {
            background: #fff3e0;
            border: none;
            padding: 10px 24px;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 50px;
            color: #aa6f30;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 3px 6px rgba(0,0,0,0.05);
            font-family: inherit;
            border: 1.5px solid #ffe0b5;
            backdrop-filter: blur(2px);
        }
        .filter-btn i { margin-right: 8px; }
        .filter-btn.active {
            background: #f97316;
            color: white;
            border-color: #f9a95c;
            box-shadow: 0 8px 16px rgba(249,115,22,0.25);
            transform: translateY(-2px);
        }
        .filter-btn:active { transform: scale(0.96); }
        /* 遊戲網格 */
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 28px;
            transition: all 0.2s;
        }
        .game-card {
            background: rgba(255, 254, 250, 0.95);
            backdrop-filter: blur(5px);
            border-radius: 48px;
            overflow: hidden;
            transition: all 0.25s ease;
            box-shadow: 0 16px 28px -8px rgba(0, 0, 0, 0.12), 0 0 0 1px rgba(255,215,150,0.6);
            cursor: pointer;
            transform: translateY(0);
            display: flex;
            flex-direction: column;
        }
        .game-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 24px 35px -10px rgba(160, 80, 20, 0.25);
            background: white;
        }
        .card-category {
            height: 12px;
            width: 100%;
        }
        .cat-math { background: linear-gradient(90deg, #3b82f6, #60a5fa); }
        .cat-english { background: linear-gradient(90deg, #10b981, #34d399); }
        .cat-chinese { background: linear-gradient(90deg, #f43f5e, #fb7185); }
        .cat-logic { background: linear-gradient(90deg, #f59e0b, #fbbf24); }
        .card-content {
            padding: 22px 20px 24px;
            flex: 1;
        }
        .game-icon {
            font-size: 3rem;
            margin-bottom: 12px;
            display: inline-block;
            background: #fef2e6;
            padding: 8px 18px;
            border-radius: 50px;
        }
        .game-title {
            font-size: 1.65rem;
            font-weight: 800;
            color: #4a2e12;
            line-height: 1.3;
            margin-bottom: 10px;
            letter-spacing: -0.2px;
        }
        .game-desc {
            font-size: 0.9rem;
            color: #9b6b3c;
            font-weight: 500;
            margin-bottom: 20px;
            line-height: 1.4;
        }
        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 8px;
        }
        .badge {
            background: #ffefdb;
            padding: 4px 16px;
            border-radius: 50px;
            font-size: 0.7rem;
            font-weight: 800;
            color: #bc6f2c;
            text-transform: uppercase;
        }
        .play-link {
            background: #f0a55a;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.1s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: inherit;
            box-shadow: 0 3px 0 #b45a2a;
        }
        .play-link:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #b45a2a;
        }
        .footer-note {
            margin-top: 60px;
            text-align: center;
            color: #ba7a42;
            font-weight: 600;
            background: rgba(255,245,225,0.7);
            backdrop-filter: blur(8px);
            border-radius: 50px;
            padding: 15px 18px;
            font-size: 0.9rem;
        }
        .no-result {
            text-align: center;
            grid-column: 1 / -1;
            background: #fff0df;
            border-radius: 60px;
            padding: 45px;
            font-size: 1.5rem;
            color: #b97f48;
        }
        @media (max-width: 680px) {
            body { padding: 16px 12px 30px; }
            .hero h1 { font-size: 2rem; }
            .games-grid { grid-template-columns: 1fr; gap: 20px; }
            .filter-btn { padding: 6px 18px; font-size: 0.9rem; }
            .game-title { font-size: 1.4rem; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="hero">
        <h1><i class="fas fa-star-of-life"></i> 欣欣學習總動員 <i class="fas fa-heart" style="color:#ff9f4a;"></i></h1>
        <p>🐣 爸爸媽媽哥哥愛欣欣 · 一次玩遍所有遊戲 🧸</p>
    </div>

    <div class="filter-bar" id="filterBar">
        <button class="filter-btn active" data-filter="all"><i class="fas fa-apple-alt"></i> 全部</button>
        <button class="filter-btn" data-filter="math"><i class="fas fa-calculator"></i> 數學</button>
        <button class="filter-btn" data-filter="english"><i class="fas fa-language"></i> 英文</button>
        <button class="filter-btn" data-filter="chinese"><i class="fas fa-pen-fancy"></i> 中文</button>
        <button class="filter-btn" data-filter="logic"><i class="fas fa-puzzle-piece"></i> 邏輯/觀察</button>
    </div>

    <div id="gamesGrid" class="games-grid"></div>

    <div class="footer-note">
        🌈 點擊「馬上玩」開開心心學習！所有遊戲皆可獨立運作，支援粵語/英語互動 🌈<br>
        💖 請將所有 .html 檔案與 index.html 放在同一個資料夾，即可正常遊玩 💖
    </div>
</div>

<script>
    // --------------------------------------------------------------
    // 遊戲資料庫 (根據所有提供檔案，完整收錄)
    // --------------------------------------------------------------
    const gamesData = [
        // ========= 數學類 =========
        { fileName: "0120 addition less 20 substraction less 10.html", title: "🧸 加減魔法師", desc: "加法 ≤ 20，減法 ≤ 10，每20題獲得驚喜動畫！", category: "math", icon: "fa-calculator" },
        { fileName: "0120_sorting_numbers.html", title: "🔢 數字排排樂", desc: "0-100 以內數字排序，由小到大或由大到小挑戰", category: "math", icon: "fa-sort-amount-down" },
        { fileName: "0130_plus_or_minus.html", title: "➕➖ 符號大挑戰", desc: "選出正確的加號或減號，填空算術遊戲", category: "math", icon: "fa-question-circle" },
        { fileName: "0125_addition_tree.html", title: "🍎 10以內分解樹", desc: "數字拆解填空，訓練數感與組合能力", category: "math", icon: "fa-tree" },
        { fileName: "0121 addition and substraction alternative.html", title: "🎈 填充題 ≤10", desc: "加減填充題，可愛視覺動畫輔助", category: "math", icon: "fa-puzzle-piece" },
        { fileName: "0100 odd even v3_andriod.html", title: "🔍 奇偶小偵探", desc: "學習單數 (Odd) 與雙數 (Even)，語音互動", category: "math", icon: "fa-eye" },
        { fileName: "0010_clock.html", title: "🕒 睇鐘學時間", desc: "認讀時鐘，15分鐘間隔，粵語+英語報時", category: "math", icon: "fa-clock" },
        { fileName: "0132_10_cars_5_missing.html", title: "🚂 數字小火車 (10卡)", desc: "拖曳數字填補空缺，學習數列規律", category: "math", icon: "fa-train" },
        { fileName: "0131_5_cars_1_missing.html", title: "🚂 數字小火車 (5卡)", desc: "5卡車廂，點選正確數字，簡單入門", category: "math", icon: "fa-subway" },
        // ========= 英文類 =========
        { fileName: "0320_eng_article.html", title: "📖 欣欣學英文 · 文章庫", desc: "英文文章閱讀 + 粵語/英語雙語朗讀 + 翻譯", category: "english", icon: "fa-book-open" },
        { fileName: "0310_eng_fill_in.html", title: "📝 欣欣填空樂園", desc: "2-3字母填空遊戲，英式英語與粵語解釋", category: "english", icon: "fa-keyboard" },
        { fileName: "0305_eng_word_and_artiicle.html", title: "🌱 慢速拼讀＋聽音遊戲", desc: "Phonics單字拆解+聽音選擇，超慢速友善", category: "english", icon: "fa-headphones" },
        { fileName: "0300_eng_word_v2.html", title: "💬 開心記句子", desc: "句子拼讀、分組管理、聽音挑戰遊戲", category: "english", icon: "fa-smile" },
        // ========= 中文類 =========
        { fileName: "0230_中文量詞.html", title: "📦 生活量詞小測驗", desc: "50題量詞挑戰，認識「隻/個/條/張」", category: "chinese", icon: "fa-boxes" },
        { fileName: "0220_article_Chinese_reading.html", title: "📚 欣欣學中文 · 粵普朗讀", desc: "繁體文章閱讀，支援粵語/普通話朗讀", category: "chinese", icon: "fa-comment-dots" },
        { fileName: "0210_繁體中文 · 筆順動畫_android.html", title: "✍️ 慢速筆順練習", desc: "漢字動畫筆順 + 聽音認字遊戲", category: "chinese", icon: "fa-paint-brush" },
        { fileName: "0215_繁體中文_閱讀.html", title: "📖 中文閱讀小書屋", desc: "內建文章閱讀，筆順學習，聽音遊戲", category: "chinese", icon: "fa-book" },
        // ========= 邏輯 / 形狀 / 方向 / 觀察 =========
        { fileName: "0140_count_shapes_no.html", title: "🔺 數圖形挑戰營", desc: "重疊圖形計數，訓練觀察與數數能力", category: "logic", icon: "fa-shapes" },
        { fileName: "0150_shape_stacking.html", title: "🏗️ 層級疊疊樂", desc: "理解形狀前後順序 (上/中/下層)", category: "logic", icon: "fa-layer-group" },
        { fileName: "0136_數氣球.html", title: "🎈 汽球尋寶遊戲", desc: "學習左/右方向及序數概念", category: "logic", icon: "fa-arrow-left" },
        { fileName: "0135_雪糕規律.html", title: "🍦 冰淇淋規律", desc: "色彩/順序推理，找出下一個冰淇淋", category: "logic", icon: "fa-chart-line" },
        { fileName: "0020_lift_right_iphone.html", title: "⇦ 左 or 右 ⇨", desc: "根據單字「LEFT / RIGHT」點選正確方向", category: "logic", icon: "fa-hand-peace" }
    ];

    // 輔助：轉換檔名為可用的URL（保留原始名稱）
    function encodeGameUrl(fileName) {
        return encodeURI(fileName);
    }

    // 渲染卡片 (支援分類過濾)
    function renderGames(filterCategory = "all") {
        const container = document.getElementById('gamesGrid');
        if (!container) return;
        
        const filtered = gamesData.filter(game => filterCategory === "all" || game.category === filterCategory);
        
        if (filtered.length === 0) {
            container.innerHTML = `<div class="no-result"><i class="fas fa-face-frown"></i> 冇呢類遊戲住，揀其他分類啦 ✨</div>`;
            return;
        }
        
        let cardsHtml = '';
        for (let game of filtered) {
            const categoryClass = 
                game.category === 'math' ? 'cat-math' :
                game.category === 'english' ? 'cat-english' :
                game.category === 'chinese' ? 'cat-chinese' : 'cat-logic';
            
            const categoryName = 
                game.category === 'math' ? '🧮 數學' :
                game.category === 'english' ? '🇬🇧 英文' :
                game.category === 'chinese' ? '🇭🇰 中文' : '🧩 邏輯觀察';
            
            const iconClass = game.icon || (game.category === 'math' ? 'fa-calculator' : 'fa-gamepad');
            
            cardsHtml += `
                <div class="game-card" data-category="${game.category}">
                    <div class="card-category ${categoryClass}"></div>
                    <div class="card-content">
                        <div class="game-icon"><i class="fas ${iconClass}"></i></div>
                        <div class="game-title">${escapeHtml(game.title)}</div>
                        <div class="game-desc">${escapeHtml(game.desc)}</div>
                        <div class="card-footer">
                            <span class="badge">${categoryName}</span>
                            <button class="play-link" data-url="${encodeGameUrl(game.fileName)}">
                                <i class="fas fa-play"></i> 馬上玩
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }
        
        container.innerHTML = cardsHtml;
        
        // 綁定每個按鈕的點擊事件 (直接在新分頁開啟遊戲)
        document.querySelectorAll('.play-link').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const url = btn.getAttribute('data-url');
                if (url) {
                    window.open(url, '_blank');
                }
            });
        });
    }
    
    function escapeHtml(str) {
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
    
    // 篩選器互動
    function initFilters() {
        const btns = document.querySelectorAll('.filter-btn');
        btns.forEach(btn => {
            btn.addEventListener('click', () => {
                const filter = btn.getAttribute('data-filter');
                btns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                renderGames(filter);
            });
        });
    }
    
    // 點擊卡片本身也可以觸發（但避免與按鈕重複，僅作為輔助）
    document.addEventListener('click', (e) => {
        const card = e.target.closest('.game-card');
        if (card && !e.target.closest('.play-link')) {
            const playBtn = card.querySelector('.play-link');
            if (playBtn) playBtn.click();
        }
    });
    
    window.addEventListener('load', () => {
        renderGames('all');
        initFilters();
        console.log("🎉 欣欣學習樂園已啟動！請將所有遊戲HTML放在同一個資料夾。");
    });
</script>
</body>
</html>
