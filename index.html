<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <meta name="theme-color" content="#FFB347">
    <title>欣欣學習樂園 · 兒童遊戲總匯</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(135deg, #fef5e7 0%, #ffe6c9 100%);
            font-family: 'Quicksand', 'Segoe UI', 'Comic Neue', 'PingFang HK', system-ui, sans-serif;
            padding: 24px 20px 48px;
            color: #3b2a1f;
        }

        /* 可愛雲朵背景點綴 */
        body::before {
            content: "☁️☁️☁️";
            position: fixed;
            top: 20px;
            left: 0;
            right: 0;
            font-size: 80px;
            opacity: 0.08;
            pointer-events: none;
            white-space: nowrap;
            text-align: center;
            z-index: 0;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            position: relative;
            z-index: 2;
        }

        /* 標頭區 */
        .hero {
            text-align: center;
            margin-bottom: 40px;
        }
        .hero h1 {
            font-size: 3.4rem;
            font-weight: 800;
            background: linear-gradient(135deg, #FF8C42, #F4A261, #E9C46A);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            text-shadow: 4px 4px 12px rgba(255,160,80,0.2);
            letter-spacing: -0.5px;
            display: inline-block;
            margin-bottom: 8px;
        }
        .hero p {
            font-size: 1.3rem;
            font-weight: 600;
            color: #a5672c;
            background: #fff4e0cc;
            display: inline-block;
            padding: 8px 28px;
            border-radius: 60px;
            backdrop-filter: blur(4px);
            border: 1px solid #ffd4a3;
            box-shadow: 0 4px 8px rgba(0,0,0,0.02);
        }
        .hero-badge {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 16px;
            flex-wrap: wrap;
        }
        .hero-badge span {
            background: #e9b56e30;
            padding: 5px 18px;
            border-radius: 30px;
            font-size: 0.9rem;
            font-weight: 600;
            color: #b45f1b;
            backdrop-filter: blur(4px);
            border: 1px solid #ffd2a0;
        }

        /* 分類小標籤 (裝飾用) */
        .section-title {
            font-size: 1.8rem;
            font-weight: 700;
            margin: 28px 0 18px 10px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-left: 8px solid #ffaa55;
            padding-left: 20px;
        }
        .section-title span {
            background: #ffeed5;
            border-radius: 40px;
            padding: 5px 18px;
            font-size: 0.9rem;
            color: #d97a1c;
        }

        /* 遊戲網格 */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
            margin-bottom: 40px;
        }

        .game-card {
            background: rgba(255, 254, 250, 0.92);
            backdrop-filter: blur(0px);
            border-radius: 38px;
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.07), 0 2px 6px rgba(0, 0, 0, 0.02);
            transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            overflow: hidden;
            border: 3px solid white;
            cursor: pointer;
            display: flex;
            flex-direction: column;
        }
        .game-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 24px 36px rgba(0, 0, 0, 0.12), 0 6px 12px rgba(0, 0, 0, 0.05);
            border-color: #ffe0b5;
        }
        .card-inner {
            padding: 22px 20px 26px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .card-icon {
            font-size: 3rem;
            margin-bottom: 12px;
        }
        .card-title {
            font-size: 1.65rem;
            font-weight: 800;
            color: #a0522d;
            letter-spacing: -0.3px;
            margin-bottom: 10px;
            line-height: 1.25;
        }
        .card-desc {
            font-size: 0.9rem;
            color: #7a5a44;
            font-weight: 500;
            margin-bottom: 20px;
            line-height: 1.4;
            flex: 1;
        }
        .game-tag {
            display: inline-block;
            background: #fae6d2;
            border-radius: 30px;
            padding: 5px 14px;
            font-size: 0.7rem;
            font-weight: 700;
            color: #bc6f25;
            margin-top: 8px;
            width: fit-content;
            letter-spacing: 0.5px;
        }
        .play-btn {
            background: #ffbc6e;
            border: none;
            border-radius: 40px;
            padding: 12px 0;
            font-weight: 800;
            font-size: 1rem;
            color: #4d2f12;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 18px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            box-shadow: 0 5px 0 #b16224;
            text-decoration: none;
        }
        .play-btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #b16224;
        }
        a.play-btn {
            text-decoration: none;
        }
        .footer-note {
            text-align: center;
            font-size: 0.85rem;
            color: #9b7b5c;
            margin-top: 40px;
            border-top: 2px dashed #ffcd94;
            padding-top: 28px;
            font-weight: 600;
        }

        /* 簡單過濾搜尋列 (溫柔功能) */
        .search-wrap {
            max-width: 400px;
            margin: 10px auto 20px;
            position: relative;
        }
        .search-wrap input {
            width: 100%;
            padding: 14px 24px;
            border-radius: 60px;
            border: 2px solid #ffcf9a;
            background: #fffcf5;
            font-size: 1rem;
            font-family: inherit;
            outline: none;
            transition: 0.2s;
            color: #4b341e;
            font-weight: 500;
        }
        .search-wrap input:focus {
            border-color: #ffa559;
            box-shadow: 0 0 0 3px #ffe0b5;
        }

        @media (max-width: 600px) {
            body { padding: 16px 12px 30px; }
            .hero h1 { font-size: 2.4rem; }
            .hero p { font-size: 1rem; }
            .card-title { font-size: 1.45rem; }
            .game-grid { gap: 16px; }
            .section-title { font-size: 1.4rem; }
        }

        /* 返回頂部 */
        .back2top {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #ffbc6e;
            border-radius: 50%;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.6rem;
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
            cursor: pointer;
            border: none;
            transition: 0.2s;
            z-index: 99;
        }
        .back2top:active { transform: scale(0.92); }
    </style>
</head>
<body>

<div class="container">
    <div class="hero">
        <h1>🍎 欣欣學習樂園 🧸</h1>
        <p>📚 點一點・玩中學｜粵語＋英語輔助 🌟</p>
        <div class="hero-badge">
            <span>🧩 數學邏輯</span>
            <span>📖 語文認讀</span>
            <span>🎨 認知觀察</span>
            <span>🔊 雙語聽力</span>
        </div>
    </div>

    <div class="search-wrap">
        <input type="text" id="searchInput" placeholder="🔍 搜尋遊戲名稱 or 關鍵字 (例如：數字、形狀、英文)" autocomplete="off">
    </div>

    <div id="gamesContainer" class="game-grid">
        <!-- 動態載入遊戲卡片 -->
        <div style="text-align: center; width: 100%; padding: 40px;">✨ 載入中，請稍後 ✨</div>
    </div>

    <div class="footer-note">
        🌈 所有遊戲皆可獨立開啟，支援手機／平板觸控！<br>
        💡 點擊卡片按鈕「立即遊玩」會在同個視窗打開遊戲，開始快樂學習吧！
    </div>
</div>

<button class="back2top" id="back2topBtn" aria-label="回到頂部">⬆️</button>

<script>

            category: "英語學習"
        },
        { 
            filename: "0305_eng_word_and_artiicle.html",
            title: "🌿 慢速拼讀 + 閱讀",
            desc: "英文單字慢速拼讀、聽音遊戲，還有英文文章朗讀，幼幼友善。",

        {

        {

        },
        { 
            filename: "0140_count_shapes_no.html",
            title: "🔢 數圖形大冒險",

            desc: "10卡車廂，將數字拖曳至正確位置，學習數列規律（+1/+2/+5...）。",
            icon: "🚃🔟",
            category: "數學邏輯"
        },
        { 
            filename: "0131_5_cars_1_missing.html",
            title: "🚂 數字小火車 (點擊)",
            desc: "5卡車廂，點擊缺失的正確數字，規律簡單適合初階。",

        {

        {

            title: "🎈 加減填充題 ≤10",
            desc: "隨機生成填空算式，每10題有驚喜獎勵動畫，粵英雙語。",

        {

            title: "📊 數字排排樂",
            desc: "將5個數字由小到大/由大至小排序，建立數感。",

            category: "數學邏輯"
        },
        { 
            filename: "0120 addition less 20 substraction less 10.html",
            title: "🌟 加減混合練習",
            desc: "加法 ≤20，減法 ≤10，適合熟練基本運算，答對有讚美動畫。",
            icon: "➕➖💯",
            category: "數學邏輯"
        },
        { 
            filename: "0100 odd even v3_andriod.html",
            title: "🔍 奇偶小偵探",
            desc: "學習單數(odd)與雙數(even)，英式英語＋粵語即時發音。",
            icon: "🧩🕵️",

        },
        { 
            filename: "0020_lift_right_iphone.html",
            title: "👈👉 左定右？",
            desc: "根據顯示的單詞 LEFT / RIGHT / 左 / 右，選出正確方向，左右認知必備。",
            icon: "🔼🔄",
            category: "空間認知"
        },
        { 
            filename: "0010_clock.html",
            title: "🕒 睇鐘學時間",
            desc: "認讀時鐘（15分鐘間隔），點選正確時間，語音讀出時間。",
            icon: "⏰📣",
            category: "生活常識"
        }
    ];

    // 補充分類 icon 映射 (輔助)
    function getCategoryIcon(cat) {
        const map = {
            "數學邏輯": "🧮", "語文認讀": "📚", "英語學習": "🇬🇧", "空間認知": "🧭",
            "觀察認知": "🔍", "通識學習": "🌍", "邏輯思考": "🤔", "生活常識": "🏠"
        };
        return map[cat] || "🎲";
    }

    // 安全轉換檔名：空格轉為 %20 (保留原始編碼讓連結正確)
    function encodeFilename(filename) {
        // 針對空格進行編碼，但保留中文字與其他符號正常
        return filename.split(' ').map(part => encodeURIComponent(part)).join('%20');
    }

    // 渲染遊戲網格
    function renderGames(filterText = "") {
        const container = document.getElementById("gamesContainer");
        if (!container) return;
        
        const lowerFilter = filterText.toLowerCase();
        const filtered = GAMES_DATA.filter(game => 
            game.title.toLowerCase().includes(lowerFilter) || 
            game.desc.toLowerCase().includes(lowerFilter) ||
            game.category.toLowerCase().includes(lowerFilter)
        );

        if (filtered.length === 0) {
            container.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:50px; background:#fff2e0; border-radius:70px;">😢 找不到相關遊戲～ 試試其他關鍵字吧！ 🧸</div>`;
            return;
        }

        container.innerHTML = filtered.map(game => {
            // 採用 encodeFilename 確保連結正確
            const encodedFile = encodeFilename(game.filename);
            return `
                <div class="game-card">
                    <div class="card-inner">
                        <div class="card-icon">${game.icon}</div>
                        <div class="card-title">${escapeHtml(game.title)}</div>
                        <div class="card-desc">${escapeHtml(game.desc)}</div>
                        <div class="game-tag">${getCategoryIcon(game.category)} ${escapeHtml(game.category)}</div>
                        <a href="${encodedFile}" class="play-btn" target="_self" rel="noopener noreferrer">
                            🚀 立即遊玩  🎮
                        </a>
                    </div>
                </div>
            `;
        }).join('');
    }

    // 簡易防XSS
    function escapeHtml(str) {
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        }).replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, function(c) {
            return c;
        });
    }

    // 初始化監聽搜索框
    function setupSearch() {
        const searchInput = document.getElementById("searchInput");
        if (!searchInput) return;
        searchInput.addEventListener("input", (e) => {
            renderGames(e.target.value);
        });
    }

    // 回到頂部功能
    function setupBackToTop() {
        const btn = document.getElementById("back2topBtn");
        if (!btn) return;
        btn.addEventListener("click", () => {
            window.scrollTo({ top: 0, behavior: "smooth" });
        });
    }

    // 頁面載入完成
    document.addEventListener("DOMContentLoaded", () => {
        renderGames();
        setupSearch();
        setupBackToTop();

        // 若有些遊戲需要點擊統計等，簡單紀錄友善提醒（無干擾）
        console.log("🎉 欣欣樂園已載入，總共 " + GAMES_DATA.length + " 個遊戲！點擊卡片開始學習。");
        
        // 增加可選 外部點擊連結提醒 (檢查檔案是否存在會造成跨域，不檢查，讓使用者確保上傳完整)
        const allLinks = document.querySelectorAll(".play-btn");
        // 輕量防禦：如果連結目標是當前檔案且沒有特別問題就放行，避免錯誤提示
        // 無需另外處理
    });
</script>

</html>
