<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>數圖形挑戰營 | 數數小英雄</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI Emoji', 'Apple Color Emoji', sans-serif;
            background: linear-gradient(125deg, #eefce3 0%, #c8f0b0 100%);
            touch-action: manipulation;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .shape-container {
            position: relative;
            width: 100%;
            height: 44vh;
            background: #fffef7;
            background-image: radial-gradient(circle at 15% 30%, rgba(162, 238, 112, 0.15) 2.2%, transparent 2.8%);
            background-size: 30px 30px;
            border: 4px solid #7ed957;
            border-radius: 2rem;
            overflow: hidden;
            margin-bottom: 1.2rem;
            box-shadow: 0 15px 25px rgba(0, 0, 0, 0.1);
            transition: all 0.2s;
        }

        .shape {
            position: absolute;
            cursor: pointer;
            filter: drop-shadow(1px 2px 3px rgba(0, 0, 0, 0.08));
            transition: transform 0.12s ease;
            background: transparent;
        }

        .shape:active {
            transform: scale(0.92) !important;
        }

        .answer-area {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.9rem;
            width: 100%;
            flex-grow: 1;
        }

        .answer-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(3px);
            padding: 0.6rem 0.8rem;
            border-radius: 2rem;
            box-shadow: 0 8px 14px rgba(0, 0, 0, 0.05);
            border: 1px solid #b9f56e;
            flex-wrap: wrap;
            transition: opacity 0.3s;
        }

        .answer-row.solved {
            background: rgba(234, 255, 219, 0.9);
            border-color: #4ade80;
        }

        .target-shape {
            width: 52px;
            height: 52px;
            stroke-width: 2.5;
            flex-shrink: 0;
        }

        .number-group {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.5rem;
            flex: 1;
            min-width: 140px;
        }

        .number-btn {
            background-color: #fcf7e1;
            border: 2px solid #b0e458;
            border-radius: 2rem;
            padding: 0.4rem 0.65rem;
            min-width: 52px;
            font-size: 1.5rem;
            font-weight: bold;
            color: #3a5e0c;
            cursor: pointer;
            transition: 0.1s linear;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
            font-family: monospace;
        }

        .number-btn:active:not(:disabled) {
            transform: translateY(2px);
            background-color: #eaf5db;
        }

        .number-btn.correct {
            background: linear-gradient(135deg, #4ade80, #22c55e);
            color: white;
            border-color: #15803d;
            box-shadow: 0 4px 10px rgba(34, 197, 94, 0.5);
            transform: scale(1.1);
            z-index: 2;
        }

        .number-btn.wrong {
            background-color: #f87171;
            color: white;
            border-color: #dc2626;
            animation: shake 0.4s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px) rotate(-5deg); }
            75% { transform: translateX(6px) rotate(5deg); }
        }

        .toast-warning {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #ef4444;
            color: white;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 1.1rem;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(239, 68, 68, 0.4);
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease-in-out, transform 0.3s ease-in-out;
            margin-top: -20px;
        }

        .toast-warning.show {
            opacity: 1;
            margin-top: 0;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 999;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(6px);
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: linear-gradient(135deg, #ffffff, #fffbeb);
            padding: 2rem 2rem 2.2rem;
            border-radius: 3rem;
            text-align: center;
            box-shadow: 0 30px 40px rgba(0, 0, 0, 0.25);
            animation: popWin 0.35s cubic-bezier(0.34, 1.2, 0.64, 1);
            border: 3px solid #facc15;
        }

        @keyframes popWin {
            from { transform: scale(0.6); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .star-icon {
            font-size: 3.8rem;
            letter-spacing: 8px;
            color: #fbbf24;
            filter: drop-shadow(0 5px 8px rgba(0, 0, 0, 0.1));
        }

        .number-btn:disabled {
            opacity: 0.4;
            transform: none;
            cursor: not-allowed;
            box-shadow: none;
        }

        .number-btn.correct:disabled {
            opacity: 1;
        }

        .info-chip {
            background: #e9f7db;
            border-radius: 60px;
            padding: 4px 14px;
            font-weight: bold;
            font-size: 0.8rem;
            color: #3f6a1b;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .level-badge {
            background: #fef08a;
            border: 2px solid #eab308;
            color: #854d0e;
            padding: 4px 16px;
            border-radius: 999px;
            font-weight: 900;
            font-size: 1.1rem;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
            margin: 4px 0;
            display: inline-block;
        }

        @media (max-width: 550px) {
            .number-btn {
                min-width: 44px;
                font-size: 1.3rem;
                padding: 0.35rem 0.4rem;
            }
            .answer-row {
                gap: 0.4rem;
                padding: 0.6rem 0.4rem;
            }
            .target-shape {
                width: 44px;
                height: 44px;
            }
        }
    </style>
</head>
<body class="p-4 sm:p-6">
    <div class="max-w-4xl mx-auto w-full flex flex-col h-full relative">
        <div id="toast-warning" class="toast-warning">
            ❌ 哎呀！數錯囉，再仔細數一次！
        </div>
        <header class="text-center mb-2 flex flex-col items-center gap-1">
            <h1 class="text-3xl sm:text-4xl font-extrabold text-green-800 tracking-wide">🔢 數圖形大冒險 🔢</h1>
            
            <!-- 新增：已完成關卡計數器 -->
            <div class="level-badge">
                🏆 已通關：<span id="level-counter">0</span> 關
            </div>

            <div class="info-chip mt-1">
                <span>✨ 點圖形會發光 ✨</span>
                <span>｜ 每個形狀最多8個</span>
            </div>
            <p class="text-green-700 text-sm font-semibold">⭐ 圖形有大有小並互相重疊，仔細看清楚喔！</p>
        </header>
        <div id="canvas" class="shape-container"></div>
        <div class="answer-area" id="answer-area"></div>
        <p class="text-center text-stone-600 text-md font-bold mt-4 mb-2">👉 直接點擊下方的數字，回答每個圖形有幾個！</p>
    </div>
    <div id="success-modal" class="modal">
        <div class="modal-content">
            <div class="star-icon">🏆 ⭐ ⭐ ⭐ 🎉</div>
            <h2 class="text-3xl font-black text-green-700 mb-2">太強了！全數正確！</h2>
            <p class="text-gray-600 mb-5 text-lg">你是數數小偵探 🔍</p>
            <button id="play-again-btn" class="bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-8 rounded-full shadow-xl text-xl transition-all active:scale-95">
                🌟 再玩一關 🌟
            </button>
        </div>
    </div>
    <script>
        (function() {
            const canvas = document.getElementById('canvas');
            const answerArea = document.getElementById('answer-area');
            const successModal = document.getElementById('success-modal');
            const playAgainModalBtn = document.getElementById('play-again-btn');
            const toastWarning = document.getElementById('toast-warning');
            const levelCounterSpan = document.getElementById('level-counter');
            
            const SHAPE_TYPES = ['square', 'triangle', 'circle', 'rectangle'];
            let currentCounts = {};
            let solvedShapes = {};
            let warningTimeout = null;
            let completedLevels = 0; // 新增：記錄完成的關卡數

            // ================== 音效系統 (Web Audio API) ==================
            let audioCtx = null;

            function initAudio() {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
            }

            function playTone(freq, type, duration, vol = 0.1) {
                initAudio();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(vol, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            }

            function playClickShapeSound() {
                playTone(400, 'sine', 0.1, 0.05);
            }

            function playCorrectSound() {
                playTone(523.25, 'sine', 0.1, 0.1); // C5
                setTimeout(() => playTone(659.25, 'sine', 0.15, 0.1), 100); // E5
            }

            function playWrongSound() {
                playTone(150, 'sawtooth', 0.3, 0.1); // 低沉錯誤音
            }

            function playWinSound() {
                // 歡樂的過關琶音
                const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
                notes.forEach((freq, i) => {
                    setTimeout(() => playTone(freq, 'square', 0.15, 0.06), i * 150);
                });
            }
            // ==============================================================

            function hideModal() { successModal.style.display = 'none'; }
            function showModal() { successModal.style.display = 'flex'; }

            function startNewGame() {
                hideModal();
                canvas.innerHTML = '';
                answerArea.innerHTML = '';
                currentCounts = {
                    'square': 0,
                    'triangle': 0,
                    'circle': 0,
                    'rectangle': 0
                };
                solvedShapes = {
                    'square': false,
                    'triangle': false,
                    'circle': false,
                    'rectangle': false
                };
                generateAllShapes();
                createAnswerUI();
            }

            function getRandomCount() {
                return Math.floor(Math.random() * 8) + 1;
            }

            function showWarning() {
                if (warningTimeout) clearTimeout(warningTimeout);
                toastWarning.classList.add('show');
                warningTimeout = setTimeout(() => {
                    toastWarning.classList.remove('show');
                }, 1500);
            }

            function generateAllShapes() {
                let containerRect = canvas.getBoundingClientRect();
                let safeWidth = containerRect.width;
                let safeHeight = containerRect.height;
                if (safeWidth === 0) safeWidth = window.innerWidth - 40;
                if (safeHeight === 0) safeHeight = 380;
                SHAPE_TYPES.forEach(type => {
                    const count = getRandomCount();
                    currentCounts[type] = count;
                    for (let i = 0; i < count; i++) {
                        createShapeElement(type, safeWidth, safeHeight);
                    }
                });
            }

            function createShapeElement(type, containerW, containerH) {
                const svgNS = "http://www.w3.org/2000/svg";
                let baseSize = 20 + Math.random() * 60;
                let width = baseSize;
                let height = baseSize;
                if (type === 'rectangle') {
                    width = baseSize * 1.5;
                    height = baseSize * 0.75;
                }
                const svg = document.createElementNS(svgNS, "svg");
                svg.setAttribute("width", width);
                svg.setAttribute("height", height);
                svg.classList.add('shape');
                const parentRect = canvas.getBoundingClientRect();
                const pWidth = parentRect.width;
                const pHeight = parentRect.height;
                const maxX = Math.max(0, pWidth - width - 8);
                const maxY = Math.max(0, pHeight - height - 8);
                let randX = 6 + Math.random() * maxX;
                let randY = 6 + Math.random() * maxY;
                randX = Math.min(randX, pWidth - width - 5);
                randY = Math.min(randY, pHeight - height - 5);
                randX = Math.max(3, randX);
                randY = Math.max(3, randY);
                svg.style.left = `${randX}px`;
                svg.style.top = `${randY}px`;
                const rotation = (Math.random() * 60) - 30;
                svg.style.transform = `rotate(${rotation}deg)`;
                svg.dataset.rotation = rotation;
                let shapeElement;
                switch (type) {
                    case 'square':
                        shapeElement = document.createElementNS(svgNS, "rect");
                        shapeElement.setAttribute("x", "3");
                        shapeElement.setAttribute("y", "3");
                        shapeElement.setAttribute("width", width - 6);
                        shapeElement.setAttribute("height", height - 6);
                        break;
                    case 'rectangle':
                        shapeElement = document.createElementNS(svgNS, "rect");
                        shapeElement.setAttribute("x", "3");
                        shapeElement.setAttribute("y", "3");
                        shapeElement.setAttribute("width", width - 6);
                        shapeElement.setAttribute("height", height - 6);
                        break;
                    case 'circle':
                        shapeElement = document.createElementNS(svgNS, "circle");
                        shapeElement.setAttribute("cx", width / 2);
                        shapeElement.setAttribute("cy", height / 2);
                        shapeElement.setAttribute("r", (Math.min(width, height) / 2) - 3);
                        break;
                    case 'triangle':
                        shapeElement = document.createElementNS(svgNS, "polygon");
                        shapeElement.setAttribute("points",
                            `${width/2},4 ${width-6},${height-6} 6,${height-6}`);
                        break;
                }
                shapeElement.setAttribute("stroke", "#2c4623");
                shapeElement.setAttribute("stroke-width", "3");
                shapeElement.setAttribute("fill", "none");
                svg.appendChild(shapeElement);
                
                // 點擊圖形特效與音效
                svg.addEventListener('click', (e) => {
                    e.stopPropagation();
                    playClickShapeSound(); // 播放點擊音效
                    const rot = parseFloat(svg.dataset.rotation) || 0;
                    shapeElement.setAttribute("stroke", "#3b82f6");
                    shapeElement.setAttribute("stroke-width", "4");
                    svg.style.transform = `rotate(${rot}deg) scale(1.15)`;
                    setTimeout(() => {
                        shapeElement.setAttribute("stroke", "#2c4623");
                        shapeElement.setAttribute("stroke-width", "3");
                        svg.style.transform = `rotate(${rot}deg) scale(1)`;
                    }, 170);
                });
                canvas.appendChild(svg);
            }

            function createAnswerUI() {
                SHAPE_TYPES.forEach(type => {
                    const row = document.createElement('div');
                    row.className = 'answer-row';
                    row.dataset.shapeType = type;
                    const iconSvg = getShapeIconSvg(type);
                    const equalSpan = document.createElement('span');
                    equalSpan.className = 'text-2xl font-black text-stone-600 mx-0.5';
                    equalSpan.textContent = '=';
                    const numberGroup = document.createElement('div');
                    numberGroup.className = 'number-group';
                    
                    for (let num = 1; num <= 8; num++) {
                        const btn = document.createElement('button');
                        btn.className = 'number-btn';
                        btn.textContent = num;
                        
                        btn.addEventListener('click', (e) => {
                            e.stopPropagation();
                            initAudio(); // 確保使用者互動時解鎖音效
                            if (solvedShapes[type]) return;
                            
                            const correctCount = currentCounts[type];
                            if (num === correctCount) {
                                // 答對了
                                playCorrectSound(); 
                                btn.classList.add('correct');
                                solvedShapes[type] = true;
                                row.classList.add('solved');
                                
                                const allBtnsInRow = numberGroup.querySelectorAll('.number-btn');
                                allBtnsInRow.forEach(b => { b.disabled = true; });
                                
                                const allSolved = Object.values(solvedShapes).every(status => status === true);
                                if (allSolved) {
                                    // 關卡全對
                                    completedLevels++; // 更新計數
                                    levelCounterSpan.textContent = completedLevels; // 更新畫面
                                    
                                    setTimeout(() => {
                                        playWinSound();
                                        showModal();
                                    }, 400);
                                }
                            } else {
                                // 答錯了
                                playWrongSound(); 
                                btn.classList.add('wrong');
                                showWarning();
                                setTimeout(() => {
                                    btn.classList.remove('wrong');
                                }, 400);
                            }
                        });
                        numberGroup.appendChild(btn);
                    }
                    row.appendChild(iconSvg);
                    row.appendChild(equalSpan);
                    row.appendChild(numberGroup);
                    answerArea.appendChild(row);
                });
            }

            function getShapeIconSvg(type) {
                const svgNS = "http://www.w3.org/2000/svg";
                const svg = document.createElementNS(svgNS, "svg");
                svg.setAttribute("viewBox", "0 0 50 50");
                svg.classList.add('target-shape');
                let shape;
                switch (type) {
                    case 'square':
                        shape = document.createElementNS(svgNS, "rect");
                        shape.setAttribute("x", "8");
                        shape.setAttribute("y", "8");
                        shape.setAttribute("width", "34");
                        shape.setAttribute("height", "34");
                        break;
                    case 'rectangle':
                        shape = document.createElementNS(svgNS, "rect");
                        shape.setAttribute("x", "4");
                        shape.setAttribute("y", "14");
                        shape.setAttribute("width", "42");
                        shape.setAttribute("height", "22");
                        break;
                    case 'circle':
                        shape = document.createElementNS(svgNS, "circle");
                        shape.setAttribute("cx", "25");
                        shape.setAttribute("cy", "25");
                        shape.setAttribute("r", "17");
                        break;
                    case 'triangle':
                        shape = document.createElementNS(svgNS, "polygon");
                        shape.setAttribute("points", "25,8 42,38 8,38");
                        break;
                }
                shape.setAttribute("stroke", "#3f5c2f");
                shape.setAttribute("stroke-width", "3");
                shape.setAttribute("fill", "none");
                svg.appendChild(shape);
                return svg;
            }
            
            playAgainModalBtn.addEventListener('click', () => {
                initAudio(); // 確保使用者互動時解鎖音效
                startNewGame();
            });
            
            successModal.addEventListener('click', (e) => {
                if (e.target === successModal) {}
            });
            
            window.addEventListener('load', () => {
                setTimeout(() => {
                    startNewGame();
                }, 80);
            });
        })();
    </script>
</body>
</html>
