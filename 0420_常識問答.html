            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .game-container {
            background-color: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            padding: 30px;
            max-width: 800px;
            width: 100%;
            text-align: center;
        }
        h1 { color: #2c3e50; font-size: 28px; margin-bottom: 20px; }
        .group-selector {
            margin-bottom: 20px;
            padding: 10px;
            font-size: 18px;
            border-radius: 10px;
            border: 2px solid #3498db;
            background-color: #ebf5fb;
            cursor: pointer;
            width: 80%;
            max-width: 400px;
        }
        .question-box, .answer-box {
            background-color: #e8f6f3;
            border: 3px solid #1abc9c;
            border-radius: 15px;
            padding: 25px 60px 25px 25px;
            margin-bottom: 20px;
            font-size: 26px;
            color: #34495e;
            position: relative;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            word-break: keep-all;
        }
        .answer-box {
            background-color: #fef9e7;
            border-color: #f1c40f;
            display: none;
        }
        .btn-speak {
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            font-size: 20px;
            cursor: pointer;
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background-color 0.2s;
        }
        .btn-speak:hover { background-color: #2980b9; }
        .controls {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 20px;
        }
        .btn-action {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 15px 25px;
            font-size: 20px;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .btn-action:hover { background-color: #c0392b; }
        .btn-next { background-color: #9b59b6; }
        .btn-next:hover { background-color: #8e44ad; }
        .btn-prev { background-color: #f39c12; }
        .btn-prev:hover { background-color: #d68910; }
        .progress { margin-bottom: 15px; font-size: 18px; color: #7f8c8d; font-weight: bold; }
    </style>
</head>

    <div class="game-container">

        <select class="group-selector" id="group-select">

        </select>

        <div class="progress" id="progress-text">準備中...</div>

        <div class="question-box">
            <span id="q-text">載入題目中...</span>
            <button class="btn-speak" id="btn-speak-q" title="讀出題目">🔊</button>
        </div>

        <div class="answer-box" id="answer-container">
            <span id="a-text">答案會在這裡顯示</span>
            <button class="btn-speak" id="btn-speak-a" title="讀出答案">🔊</button>
        </div>

        <div class="controls">
            <button class="btn-action btn-prev" id="btn-prev">⬅️ 上一題</button>
            <button class="btn-action" id="btn-show-answer">👀 顯示答案</button>
            <button class="btn-action btn-next" id="btn-next">➡️ 下一題</button>

        // 狀態變數
        let currentGroup = 'basic';
        let currentIndex = 0;
        let currentQuestion = null;

        // 當整個網頁載入完成後才執行 JavaScript
        document.addEventListener('DOMContentLoaded', () => {
            
            // 綁定按鈕點擊事件
            document.getElementById('group-select').addEventListener('change', changeGroup);
            document.getElementById('btn-show-answer').addEventListener('click', showAnswer);
            document.getElementById('btn-next').addEventListener('click', nextQuestion);
            document.getElementById('btn-prev').addEventListener('click', prevQuestion);
            
            document.getElementById('btn-speak-q').addEventListener('click', () => {
                if(currentQuestion) speakText(currentQuestion.q);
            });
            document.getElementById('btn-speak-a').addEventListener('click', () => {
                if(currentQuestion) speakText(currentQuestion.a);
            });

            // 確保語音引擎就緒，但不阻礙程式運行
            if ('speechSynthesis' in window) {
                window.speechSynthesis.onvoiceschanged = function() {
                    window.speechSynthesis.getVoices();
                };
            }

            // 初始化第一條題目
            updateUI();
        });

        function changeGroup() {
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            
            const select = document.getElementById('group-select');
            currentGroup = select.value;
            currentIndex = 0;
            updateUI();
        }

        function updateUI() {
            currentQuestion = allData[currentGroup][currentIndex];
            const totalInGroup = allData[currentGroup].length;
            
            document.getElementById('q-text').textContent = currentQuestion.q;
            document.getElementById('a-text').textContent = currentQuestion.a;
            
            document.getElementById('answer-container').style.display = 'none';
            document.getElementById('progress-text').textContent = `題目: ${currentIndex + 1} / ${totalInGroup}`;
            
            // 自動讀出新題目 (稍微延遲確保UI更新)
            setTimeout(() => {
                if(currentQuestion) speakText(currentQuestion.q);
            }, 300);
        }

        function showAnswer() {
            document.getElementById('answer-container').style.display = 'flex';
            setTimeout(() => {
                if(currentQuestion) speakText(currentQuestion.a);
            }, 100);
        }

        function nextQuestion() {
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            
            currentIndex++;
            if (currentIndex >= allData[currentGroup].length) {
                currentIndex = 0; // 循環回到第一題
                alert("太棒了！你已經完成這組所有題目，我們從頭再來一次吧！");
            }
            updateUI();
        }

        function prevQuestion() {
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            
            currentIndex--;
            if (currentIndex < 0) {
                currentIndex = allData[currentGroup].length - 1; // 如果是第一題，跳回最後一題
            }
            updateUI();
        }

        function speakText(text) {
            if (!('speechSynthesis' in window)) {
                alert("你的瀏覽器不支援語音功能，建議使用 Google Chrome 或 Safari。");
                return;
            }
            
            window.speechSynthesis.cancel();
            
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'zh-HK'; 
            
            // 語速維持較慢，方便小朋友聆聽
            utterance.rate = 0.5; 
            utterance.pitch = 1.0; 
            
            const voices = window.speechSynthesis.getVoices();
            const hkVoice = voices.find(v => v.lang === 'zh-HK' || v.lang === 'yue-HK');
            if (hkVoice) {
                utterance.voice = hkVoice;
            }
            
            window.speechSynthesis.speak(utterance);
        }

    </script>
