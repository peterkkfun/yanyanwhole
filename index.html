<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>欣欣學習工具列表</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #fef5e7;
            font-family: 'Segoe UI', 'Comic Neue', 'PingFang HK', sans-serif;
            padding: 30px 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 40px;
            padding: 30px 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            border: 1px solid #ffddb0;
        }
        h1 {
            font-size: 2rem;
            color: #d45a3a;
            text-align: center;
            margin-bottom: 8px;
        }
        .sub {
            text-align: center;
            color: #b87a54;
            margin-bottom: 30px;
            font-weight: 500;
        }
        .file-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .file-link {
            display: block;
            padding: 14px 20px;
            background: #fffaf2;
            border-radius: 60px;
            text-decoration: none;
            color: #4a2e1e;
            font-weight: 600;
            border: 2px solid #ffdfbf;
            transition: 0.2s;
            font-size: 1rem;
        }
        .file-link:hover {
            background: #ffe6d0;
            border-color: #ffb87a;
            transform: translateX(5px);
        }
        .file-icon {
            display: inline-block;
            margin-right: 12px;
            font-size: 1.4rem;
        }
        footer {
            text-align: center;
            margin-top: 35px;
            color: #c68b5a;
            font-size: 0.85rem;
        }
        hr {
            margin: 20px 0;
            border: 1px dashed #ffd9b5;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🌸 欣欣學習工具 🌸</h1>
    <div class="sub">點擊名稱即可開始遊戲或練習</div>
    <div class="file-list" id="fileList"></div>
    <hr>
    <footer>💡 請將所有 .html 檔案與本頁面放在同一個資料夾內，點擊即可開啟。</footer>
</div>

<script>
    // 依照您提供的所有檔案名稱 (依實際上載檔案清單)
    const allFiles = [
        "0010_clock.html",
        "0020_lift_right_iphone.html",
        "0100 odd even v3_andriod.html",
        "0120 addition less 20 substraction less 10.html",
        "0120_sorting_numbers.html",
        "0121 addition and substraction alternative.html",
        "0125_addition_tree.html",
        "0130_plus_or_minus.html",
        "0131_5_cars_1_missing.html",
        "0132_10_cars_5_missing.html",
        "0135_雪糕規律.html",
        "0136_數氣球.html",
        "0140_count_shapes_no.html",
        "0150_shape_stacking.html",
        "0215_繁體中文_閱讀.html",
        "0230_中文量詞.html",
        "0305_eng_word_and_artiicle.html",
        "0310_eng_fill_in.html",
        "0410_厚薄窄闊學習遊戲.html",
        "0420_常識問答.html",
        "0430_情境問答遊戲.html"
    ];

    const listContainer = document.getElementById('fileList');

    // 可選：為每個檔案加一個小圖示 (根據檔名關鍵字)
    function getIcon(filename) {
        if (filename.includes('clock')) return '🕒';
        if (filename.includes('left') || filename.includes('right')) return '⬅️';
        if (filename.includes('odd') || filename.includes('even')) return '🔢';
        if (filename.includes('addition') || filename.includes('substraction')) return '➕';
        if (filename.includes('sorting')) return '🔢';
        if (filename.includes('雪糕')) return '🍦';
        if (filename.includes('氣球')) return '🎈';
        if (filename.includes('shape') || filename.includes('圖形')) return '🔷';
        if (filename.includes('中文') || filename.includes('量詞')) return '📖';
        if (filename.includes('eng') || filename.includes('english')) return '🌍';
        if (filename.includes('厚薄') || filename.includes('常識') || filename.includes('情境')) return '🧠';
        return '📁';
    }

    allFiles.forEach(file => {
        const link = document.createElement('a');
        link.className = 'file-link';
        link.href = file;
        link.target = '_blank';
        const icon = getIcon(file);
        // 顯示美化名稱 (去掉 .html，保留原始名稱)
        let displayName = file.replace('.html', '');
        link.innerHTML = `<span class="file-icon">${icon}</span> ${displayName}`;
        listContainer.appendChild(link);
    });
</script>
</body>
</html>
