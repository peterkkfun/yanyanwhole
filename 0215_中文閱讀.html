<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>🌸 欣欣學中文 🌸 | 筆順 + 聽音遊戲 + 文章閱讀</title>
    <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body {
            font-family: 'Quicksand', 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(145deg, #ffd1dc 0%, #ffe4ec 100%);
            min-height: 100vh;
            display: flex; justify-content: center; align-items: center;
            padding: 16px 12px;
        }
        .container {
            max-width: 900px; width: 100%;
            background-color: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 48px;
            box-shadow: 0 20px 40px rgba(245, 150, 180, 0.25);
            overflow: hidden;
            border: 3px solid #ffb6c1;
        }
        .header {
            background: #e57399; padding: 22px 20px; text-align: center; color: white; text-shadow: 2px 2px 0 #b3406c;
        }
        .header h1 { font-size: 2.2rem; font-weight: 700; }
        .header p {
            font-size: 1.1rem; font-weight: 600; background: #fff0f5; display: inline-block;
            padding: 5px 18px; border-radius: 50px; color: #b3406c; margin-top: 8px; text-shadow: none;
        }
        .main-view { padding: 25px 24px 35px; }
        
        .btn {
            border: none; font-weight: 700; padding: 12px 22px; border-radius: 50px;
            font-size: 1.1rem; font-family: 'Quicksand', sans-serif; cursor: pointer;
            transition: 0.2s; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn:active { transform: translateY(3px); }
        .btn-pink { background: #ffb6c1; color: #6b2e4a; box-shadow: 0 5px 0 #d46b87; border: 2px solid #ffe5f0; }
        .btn-pink:hover { background: #ff9fb0; }
        .btn-blue { background: #64b5f6; color: white; box-shadow: 0 5px 0 #1e88e5; }
        .btn-blue:hover { background: #42a5f5; }
        .btn-green { background: #81c784; color: white; box-shadow: 0 5px 0 #388e3c; }
        .btn-green:hover { background: #66bb6a; }
        .btn-orange { background: #ffb74d; color: white; box-shadow: 0 5px 0 #f57c00; }
        .btn-orange:hover { background: #ffa726; }
        .btn-outline { background: transparent; border: 3px solid #e57399; color: #b3406c; box-shadow: none;}
        .btn-outline-red { background: white; border: 3px solid #e57373; color: #d32f2f; box-shadow: none; }
        .btn-outline-red:hover { background: #ffebee; }

        .input-area {
            background: #fff0f5; border-radius: 40px; padding: 25px; margin-bottom: 20px; border: 2px dashed #ff98ae;
        }
        .input-label { font-weight: 800; color: #a1375e; font-size: 1.1rem; margin-bottom: 8px; display: block; }
        input[type="text"], textarea {
            width: 100%; border-radius: 20px; border: 2.5px solid #ffb0c3; padding: 14px 18px;
            font-size: 1.1rem; font-family: 'Quicksand', sans-serif; background: #fff9fb;
            outline: none; color: #3f1e2c; font-weight: 600; margin-bottom: 15px; resize: vertical;
        }
        input[type="text"]:focus, textarea:focus { border-color: #e57399; box-shadow: 0 0 0 4px #ffe0eb; }

        .group-panel { background: #ffe4ec; border-radius: 40px; padding: 20px; border: 2px solid #ffb6c1; margin-bottom: 25px; }
        .group-badge {
            background: white; border-radius: 50px; padding: 8px 16px; margin: 6px;
            display: inline-flex; align-items: center; gap: 10px; box-shadow: 0 3px 6px #ffcce0;
            border: 2px solid #ff9fb0; cursor: pointer; transition: 0.2s;
        }
        .group-badge.active { background: #ffb6c1; border-color: #d46b87; box-shadow: 0 4px 10px rgba(229, 115, 153, 0.4); transform: scale(1.02); }
        .group-name { font-weight: 800; color: #6b2e4a; }
        .del-group-btn { background: #ffebee; color: #c62828; border: none; border-radius: 50%; width: 26px; height: 26px; cursor: pointer; display: flex; align-items: center; justify-content: center; }

        .flashcard {
            background: #fff; border-radius: 60px; padding: 30px 20px; text-align: center;
            box-shadow: inset 0 1px 6px #ffe0eb, 0 12px 20px rgba(229, 115, 153, 0.15); margin: 20px 0; border: 2px solid #ffb6c1;
        }
        .progress-tag {
            font-size: 1.3rem; background: #ffe4ec; display: inline-block; padding: 8px 22px;
            border-radius: 50px; font-weight: 700; color: #b3406c; border: 2px solid #ffb6c1; margin-bottom: 15px;
        }

        /* Stroke Area */
        .stroke-area {
            display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; padding: 20px; background: #fff0f5; border-radius: 40px; margin-top: 15px; border: 2px dashed #ffb6c1;
        }
        .char-card { background: white; border-radius: 20px; padding: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); text-align: center;}
        .char-card canvas { background: #fafafa; border-radius: 12px; border: 1px dashed #ccc; cursor: pointer;}
        
        .word-display { font-size: 3.5rem; font-weight: bold; color: #a1375e; letter-spacing: 5px; margin-bottom: 10px; }
        .clickable-char { display: inline-block; cursor: pointer; transition: color 0.1s; padding: 0 4px; }
        .clickable-char:hover { color: #ff4081; transform: scale(1.05); }

        /* Article */
        .sentence-box { background: #ffeef2; border-radius: 40px; padding: 25px; margin: 20px auto; border: 3px dashed #ffb7c7; text-align: center; }
        .chinese-sentence-display { font-size: 2.2rem; font-weight: 700; color: #3e1e2c; line-height: 1.6; margin-bottom: 20px; word-break: break-word; }
        .char-span { display: inline-block; padding: 0 4px; border-radius: 12px; cursor: pointer; transition: 0.1s; }
        .char-span:hover { background: #ffe4ec; }
        .highlight { background: #ffd966 !important; color: #2d1a22 !important; box-shadow: 0 0 10px #ffb82e; font-weight: 800; }

        /* 自訂拉桿樣式 (Slider) */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]:focus { outline: none; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 24px;
            width: 24px;
            border-radius: 50%;
            background: #e57399;
            cursor: pointer;
            margin-top: -7px;
            box-shadow: 0 2px 5px rgba(229, 115, 153, 0.4);
            border: 3px solid white;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 10px;
            cursor: pointer;
            background: #ffe0eb;
            border-radius: 5px;
            border: 1px solid #ffb6c1;
        }

        /* Game */
        .big-play-btn {
            font-size: 5rem; width: 140px; height: 140px; border-radius: 50%; background: #ffb74d; border: 5px solid #f57c00;
            color: white; cursor: pointer; margin: 15px auto; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 20px rgba(0,0,0,0.15);
        }
        .game-options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 25px; }
        .game-option-btn {
            background: white; border: 3px solid #ffb6c1; border-radius: 25px; padding: 20px 15px; font-size: 2rem;
            font-weight: bold; color: #a1375e; cursor: pointer; transition: 0.2s; box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }
        .game-option-btn.correct { background: #c8e6c9; border-color: #388e3c; color:#1b5e20;}
        .game-option-btn.wrong { background: #ffcdd2; border-color: #d32f2f; color:#b71c1c; animation: shake 0.5s; }

        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }
        .popup-banner {
            position: fixed; top: 40%; left: 50%; transform: translate(-50%, -50%); background: #fff0f5;
            border-radius: 60px; padding: 25px 40px; text-align: center; z-index: 1000;
            box-shadow: 0 20px 40px rgba(229, 115, 153, 0.4); border: 5px solid #ffb6c1; animation: bouncePop 0.4s ease;
        }
        .popup-banner h2 { color: #b3406c; font-size: 2.2rem; margin-bottom: 10px; }
        @keyframes bouncePop { 0% { opacity: 0; transform: translate(-50%, -50%) scale(0.8);} 100% { opacity: 1; transform: translate(-50%, -50%) scale(1);} }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🌸 欣欣學中文 🌸</h1>
        <p>筆順動畫 + 聽音遊戲 + 粵普雙語文章閱讀</p>
    </div>

    <!-- 主選單：群組與文章管理 -->
    <div id="inputView" class="main-view">
        <div class="group-panel">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h3 style="color:#a1375e; margin: 0;"><i class="fas fa-tags"></i> 選擇學習群組：</h3>
                <button id="sortGroupsBtn" class="btn btn-outline" style="font-size: 0.9rem; padding: 6px 15px; border-radius: 20px;"><i class="fas fa-sort-alpha-down"></i> 群組排序</button>
            </div>
            <div id="groupManagerPanel" style="display:flex; flex-wrap:wrap; max-height:200px; overflow-y:auto;"></div>
        </div>

        <div class="input-area">
            <span class="input-label"><i class="fas fa-folder"></i> 群組名稱</span>
            <input type="text" id="groupNameInput" placeholder="例如: 第一課生字">

            <span class="input-label"><i class="fas fa-pen-fancy"></i> 中文單字或詞語 (請用逗號分隔)</span>
            <textarea id="wordInput" rows="2" placeholder="例如: 蘋果, 香蕉, 學校, 開心"></textarea>

            <span class="input-label"><i class="fas fa-book-open"></i> 專屬閱讀文章 (標題與內容)</span>
            <input type="text" id="articleTitleInput" placeholder="文章標題 (例如: 我的學校)">
            <textarea id="articleContentInput" rows="3" placeholder="請輸入中文文章內容... 系統會自動按標點切分句子。"></textarea>
            
            <div style="display: flex; gap: 12px; margin-top: 15px; flex-wrap: wrap;">
                <button id="saveGroupBtn" class="btn btn-pink"><i class="fas fa-save"></i> 更新目前群組</button>
                <button id="newGroupBtn" class="btn btn-outline" style="border-color:#ffb6c1;"><i class="fas fa-plus"></i> 新增為新群組</button>
            </div>
        </div>

        <div style="display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; margin-top: 30px; border-top: 2px dashed #ffb6c1; padding-top: 25px;">
            <button id="startTrainBtn" class="btn btn-green"><i class="fas fa-pen"></i> 筆順動畫學習</button>
            <button id="startGameBtn" class="btn btn-orange"><i class="fas fa-gamepad"></i> 聽音選字遊戲</button>
            <button id="startArticleBtn" class="btn btn-blue"><i class="fas fa-book-reader"></i> 進入文章閱讀</button>
        </div>

        <div style="margin-top: 30px; text-align: center;">
            <button id="exportDataBtn" class="btn btn-outline" style="font-size: 0.9rem; padding: 8px 15px;">匯出 JSON</button>
            <button id="importDataBtn" class="btn btn-outline" style="font-size: 0.9rem; padding: 8px 15px;">匯入 JSON</button>
            <input type="file" id="importFileHidden" accept=".json" style="display: none;">
        </div>
    </div>

    <!-- 模式一：筆順學習 -->
    <div id="trainingView" class="main-view" style="display: none;">
        <div style="text-align: center;"><span class="progress-tag" id="trainProgress">0 / 0</span></div>
        <div class="flashcard">
            <div class="word-display" id="currentWordTarget">載入中...</div>
            <div style="font-size: 0.95rem; color: #a1375e; margin-bottom: 15px; font-weight: 600;">💡 點擊上方任何一個字，可以單獨用廣東話讀出喔！</div>
            <div style="margin-bottom: 15px;">
                <button id="playAudioCantoBtn" class="btn btn-pink"><i class="fas fa-volume-up"></i> 廣東話</button>
                <button id="playAudioMandoBtn" class="btn btn-outline"><i class="fas fa-volume-up"></i> 普通話</button>
            </div>
            
            <div style="margin-top:15px;">
                <label style="font-weight:bold; color:#a1375e; margin-right:10px;">筆畫速度:</label>
                <input type="radio" name="speedOption" id="speedSlow" value="slow" checked> <label for="speedSlow" style="margin-right:10px;">慢速 (適合小朋友)</label>
                <input type="radio" name="speedOption" id="speedNormal" value="normal"> <label for="speedNormal">正常</label>
            </div>

            <div class="stroke-area" id="strokeAreaContainer"></div>
            
        </div>
        <div style="display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; margin-top: 20px;">
            <button class="btn btn-outline backToMainBtn"><i class="fas fa-home"></i> 返回主頁</button>
            <button id="prevWordBtn" class="btn btn-pink"><i class="fas fa-arrow-left"></i> 上一個</button>
            <button id="addToFavBtn" class="btn btn-pink"><i class="fas fa-heart"></i> 加入最愛</button>
            <button id="nextWordBtn" class="btn btn-pink">下一個 <i class="fas fa-arrow-right"></i></button>
        </div>
    </div>

    <!-- 模式二：聽音遊戲 -->
    <div id="gameView" class="main-view" style="display: none;">
        <div style="text-align: center;"><span class="progress-tag" id="gameProgress">第一關：0 / 0</span></div>
        <div class="flashcard">
            <h3 style="color:#a1375e; margin-bottom:10px;">聽聲音，選出正確的詞語！</h3>
            
            <div style="margin-bottom: 10px;">
                <label style="font-weight:bold; color:#a1375e; margin-right:10px;">遊戲語言:</label>
                <input type="radio" name="gameLang" id="gameCanto" value="canto" checked> <label for="gameCanto" style="margin-right:10px;">廣東話</label>
                <input type="radio" name="gameLang" id="gameMando" value="mando"> <label for="gameMando">普通話</label>
            </div>

            <div class="big-play-btn" id="playGameAudioBtn"><i class="fas fa-volume-up"></i></div>
            <div class="game-options-grid" id="gameOptionsContainer"></div>
        </div>
        <div style="display: flex; justify-content: center; margin-top: 20px;">
            <button class="btn btn-outline backToMainBtn"><i class="fas fa-home"></i> 結束遊戲</button>
        </div>
    </div>

    <!-- 模式三：文章閱讀 -->
    <div id="articleView" class="main-view" style="display: none;">
        <div style="text-align: center;"><span class="progress-tag" id="articleProgress">句子 0 / 0</span></div>
        <div class="flashcard" style="text-align: left; padding: 25px 20px;">
            <h2 id="articleReadTitle" style="text-align: center; color: #a1375e; margin-bottom: 15px;">文章標題</h2>
            
            <div class="sentence-box">
                <div class="chinese-sentence-display" id="articleSentenceDisplay"></div>
            </div>

            <!-- 新增朗讀速度控制拉桿 -->
            <div style="background: #fff0f5; padding: 15px 20px; border-radius: 25px; border: 2px dashed #ffb6c1; margin-bottom: 20px; text-align: center;">
                <label for="speedSlider" style="font-weight:800; color:#a1375e; display:block; margin-bottom: 10px; font-size: 1.1rem;">
                    <i class="fas fa-tachometer-alt"></i> 朗讀速度調整
                </label>
                <div style="display: flex; align-items: center; justify-content: center; gap: 15px;">
                    <span style="color: #b3406c; font-weight: 700; font-size: 1.2rem;">🐢</span>
                    <input type="range" id="speedSlider" min="0.1" max="1.0" step="0.1" value="0.4" style="max-width: 250px;">
                    <span style="color: #b3406c; font-weight: 700; font-size: 1.2rem;">🐇</span>
                </div>
                <div id="speedValueDisplay" style="color: #e57399; font-weight: 700; margin-top: 8px; font-size: 0.95rem;">
                    目前速度: 0.4 (適合學習 👶)
                </div>
            </div>

            <div style="display: flex; justify-content: center; gap: 15px; flex-wrap: wrap;">
                <button id="speakCantoBtn" class="btn btn-pink"><i class="fas fa-comment-dots"></i> 朗讀廣東話</button>
                <button id="speakMandoBtn" class="btn btn-outline"><i class="fas fa-comment-dots"></i> 朗讀普通話</button>
            </div>
        </div>
        <div style="display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; margin-top: 20px;">
            <button class="btn btn-outline backToMainBtn"><i class="fas fa-home"></i> 返回主頁</button>
            <button id="prevArticleBtn" class="btn btn-pink"><i class="fas fa-arrow-left"></i> 上一句</button>
            <button id="nextArticleBtn" class="btn btn-blue">下一句 <i class="fas fa-arrow-right"></i></button>
        </div>
    </div>
</div>

<script>
    (function() {
        // --- 資料結構 ---
        let groups = [];
        let currentGroupId = null;

        // --- 預設資料 ---
        const DEFAULT_GROUPS = [
            {
                id: 101,
                name: "1. 認識動物",
                words: ["小狗", "貓咪", "大象", "兔子"],
                articleTitle: "動物園",
                articleContent: "我喜歡去動物園。那裡有可愛的小狗和貓咪。大象的鼻子很長。兔子的耳朵也很長。"
            },
            {
                id: 102,
                name: "2. 水果和食物",
                words: ["蘋果", "香蕉", "西瓜", "米飯"],
                articleTitle: "好吃的食物",
                articleContent: "媽媽買了紅色的蘋果和黃色的香蕉。夏天吃西瓜很涼快。我每天都會吃米飯。"
            }
        ];

        // --- 變數狀態 ---
        let trainingWords = []; let currentTrainIdx = 0; let hanziWriters = [];
        let isGaming = false; let gameWordsPool = []; let gameTargetWord = ""; let gameRoundCount = 0;
        let shuffledGameWords = []; 
        let articleSentences = []; let currentSentenceIdx = 0;

        // --- 語音核心 ---
        const synth = window.speechSynthesis;
        const SLOW_RATE_ARTICLE = 0.42; // 用於遊戲預設速度
        const SLOW_RATE_CHAR = 0.50;

        function speakCantonese(text, onBoundary, onEnd, rate = SLOW_RATE_ARTICLE) {
            if(!synth) return;
            synth.cancel();
            const utter = new SpeechSynthesisUtterance(text);
            utter.lang = 'zh-HK';
            
            const voices = synth.getVoices();
            const hkVoice = voices.find(v => v.lang === 'zh-HK' || v.lang === 'zh-YUE' || v.name.toLowerCase().includes('cantonese') || v.name.toLowerCase().includes('hong kong'));
            if(hkVoice) utter.voice = hkVoice;
            
            utter.rate = rate; 
            if(onBoundary) utter.onboundary = onBoundary;
            if(onEnd) utter.onend = onEnd;
            synth.speak(utter);
        }

        function speakMandarin(text, onBoundary, onEnd, rate = SLOW_RATE_ARTICLE) {
            if(!synth) return;
            synth.cancel();
            const utter = new SpeechSynthesisUtterance(text);
            utter.lang = 'zh-TW';
            
            const voices = synth.getVoices();
            const twVoice = voices.find(v => v.lang === 'zh-TW' || v.lang === 'zh-CN' || v.name.toLowerCase().includes('mandarin') || v.name.toLowerCase().includes('chinese'));
            if(twVoice) utter.voice = twVoice;
            
            utter.rate = rate; 
            if(onBoundary) utter.onboundary = onBoundary;
            if(onEnd) utter.onend = onEnd;
            synth.speak(utter);
        }

        // --- 初始化與儲存邏輯 ---
        function loadGroups() {
            const saved = localStorage.getItem('欣欣學中文_完整整合版');
            if(saved) {
                try { groups = JSON.parse(saved); } catch(e) { groups = [...DEFAULT_GROUPS]; }
            } else { groups = [...DEFAULT_GROUPS]; }
            
            if(groups.length > 0) currentGroupId = groups[0].id;
            renderGroupPanels();
            selectGroup(currentGroupId);
        }

        function saveGroups() {
            localStorage.setItem('欣欣學中文_完整整合版', JSON.stringify(groups));
        }

        // --- UI 渲染 ---
        function renderGroupPanels() {
            const container = document.getElementById('groupManagerPanel');
            container.innerHTML = '';
            groups.forEach(g => {
                const badge = document.createElement('div');
                badge.className = 'group-badge' + (g.id === currentGroupId ? ' active' : '');
                
                const title = document.createElement('span');
                title.className = 'group-name';
                title.innerText = g.name;
                title.onclick = () => selectGroup(g.id);
                
                const delBtn = document.createElement('button');
                delBtn.className = 'del-group-btn';
                delBtn.innerHTML = '<i class="fas fa-times"></i>';
                delBtn.onclick = (e) => {
                    e.stopPropagation();
                    if(confirm(`確定刪除「${g.name}」群組嗎？`)) {
                        groups = groups.filter(item => item.id !== g.id);
                        if(groups.length > 0) currentGroupId = groups[0].id;
                        else currentGroupId = null;
                        saveGroups(); renderGroupPanels(); selectGroup(currentGroupId);
                    }
                };
                
                badge.appendChild(title);
                badge.appendChild(delBtn);
                container.appendChild(badge);
            });
        }

        function selectGroup(id) {
            currentGroupId = id;
            document.querySelectorAll('.group-badge').forEach(b => b.classList.remove('active'));
            renderGroupPanels(); 
            
            const group = groups.find(g => g.id === id);
            if(group) {
                document.getElementById('groupNameInput').value = group.name || '';
                document.getElementById('wordInput').value = (group.words || []).join(', ');
                document.getElementById('articleTitleInput').value = group.articleTitle || '';
                document.getElementById('articleContentInput').value = group.articleContent || '';
            } else {
                document.getElementById('groupNameInput').value = '';
                document.getElementById('wordInput').value = '';
                document.getElementById('articleTitleInput').value = '';
                document.getElementById('articleContentInput').value = '';
            }
        }

        // --- 按鈕事件綁定：群組排序 ---
        document.getElementById('sortGroupsBtn').onclick = () => {
            if(groups.length <= 1) return;
            groups.sort((a, b) => a.name.localeCompare(b.name, 'zh-Hant'));
            saveGroups();
            renderGroupPanels();
            showPopup("🔤 排序完成！", "群組已依名稱順序排列。");
        };

        // --- 按鈕事件綁定：儲存群組 ---
        document.getElementById('saveGroupBtn').onclick = () => {
            if(!currentGroupId && groups.length === 0) return document.getElementById('newGroupBtn').click();
            const group = groups.find(g => g.id === currentGroupId);
            if(group) {
                group.name = document.getElementById('groupNameInput').value.trim() || '未命名群組';
                group.words = document.getElementById('wordInput').value.split(/[,，、]+/).map(w=>w.trim()).filter(w=>w);
                group.articleTitle = document.getElementById('articleTitleInput').value.trim();
                group.articleContent = document.getElementById('articleContentInput').value.trim();
                saveGroups(); renderGroupPanels(); showPopup("💾 儲存成功！", "群組內容已更新。");
            } else if (currentGroupId) {
                document.getElementById('newGroupBtn').click();
            }
        };

        document.getElementById('newGroupBtn').onclick = () => {
            const newId = Date.now();
            groups.push({
                id: newId,
                name: document.getElementById('groupNameInput').value.trim() || '新群組',
                words: document.getElementById('wordInput').value.split(/[,，、]+/).map(w=>w.trim()).filter(w=>w),
                articleTitle: document.getElementById('articleTitleInput').value.trim(),
                articleContent: document.getElementById('articleContentInput').value.trim()
            });
            currentGroupId = newId;
            saveGroups(); renderGroupPanels(); selectGroup(newId); showPopup("✨ 新增成功！", "已建立全新學習群組。");
        };

        function showPopup(title, sub) {
            const pop = document.createElement('div');
            pop.className = 'popup-banner';
            pop.innerHTML = `<h2>${title}</h2><p style="font-weight:600; font-size:1.2rem; color:#6b2e4a;">${sub}</p>`;
            document.body.appendChild(pop);
            setTimeout(() => pop.remove(), 1800);
        }

        function switchView(viewId) {
            ['inputView', 'trainingView', 'gameView', 'articleView'].forEach(id => {
                document.getElementById(id).style.display = (id === viewId) ? 'block' : 'none';
            });
        }

        document.querySelectorAll('.backToMainBtn').forEach(btn => {
            btn.onclick = () => { synth.cancel(); isGaming = false; switchView('inputView'); };
        });


        // ==================== 模式一：筆順學習 ====================
        function updateFavBtnUI(word) {
            const favBtn = document.getElementById('addToFavBtn');
            let favGroup = groups.find(g => g.name === "❤️ 我的最愛");
            if (favGroup && favGroup.words.includes(word)) {
                favBtn.innerHTML = '<i class="fas fa-eraser"></i> 移除最愛';
                favBtn.className = 'btn btn-outline-red';
            } else {
                favBtn.innerHTML = '<i class="fas fa-heart"></i> 加入最愛';
                favBtn.className = 'btn btn-pink';
            }
        }

        document.getElementById('startTrainBtn').onclick = () => {
            const group = groups.find(g => g.id === currentGroupId);
            if(!group || group.words.length === 0) return alert("目前群組沒有單字，請先輸入！");
            trainingWords = group.words;
            currentTrainIdx = 0;
            switchView('trainingView');
            loadStrokeWord(currentTrainIdx);
        };

        function loadStrokeWord(idx) {
            if(idx < 0) idx = 0;
            if(idx >= trainingWords.length) {
                showPopup("🎉 太棒了！", "妳已經完成本組單字的學習！");
                setTimeout(() => switchView('inputView'), 2000);
                return;
            }
            currentTrainIdx = idx;
            document.getElementById('trainProgress').innerText = `${idx + 1} / ${trainingWords.length}`;
            const word = trainingWords[idx];
            
            updateFavBtnUI(word);
            
            const wordDisplayBox = document.getElementById('currentWordTarget');
            wordDisplayBox.innerHTML = '';
            for (let i = 0; i < word.length; i++) {
                const charSpan = document.createElement('span');
                charSpan.className = 'clickable-char';
                charSpan.innerText = word[i];
                charSpan.onclick = () => {
                    speakCantonese(word[i], null, null, SLOW_RATE_CHAR);
                };
                wordDisplayBox.appendChild(charSpan);
            }
            
            const strokeArea = document.getElementById('strokeAreaContainer');
            strokeArea.innerHTML = '';
            hanziWriters = [];
            
            const isSlow = document.getElementById('speedSlow').checked;
            const strokeAnimationSpeed = isSlow ? 0.4 : 0.9;
            const delayBetweenStrokes = isSlow ? 400 : 200;

            for (let i = 0; i < word.length; i++) {
                const char = word[i];
                if (!/[一-龥]/.test(char)) continue;

                const card = document.createElement('div');
                card.className = 'char-card';
                
                const canvasDiv = document.createElement('div');
                canvasDiv.id = `character-target-${i}`;
                canvasDiv.style.width = '120px';
                canvasDiv.style.height = '120px';
                canvasDiv.style.margin = '0 auto';
                
                const btnGroup = document.createElement('div');
                btnGroup.className = 'btn-group-stroke';
                btnGroup.style.display = 'flex';
                btnGroup.style.gap = '6px';
                btnGroup.style.justifyContent = 'center';
                btnGroup.style.marginTop = '10px';
                
                const animateBtn = document.createElement('button');
                animateBtn.className = 'btn btn-pink';
                animateBtn.style.padding = '6px 12px';
                animateBtn.style.fontSize = '0.95rem';
                animateBtn.innerHTML = '<i class="fas fa-redo"></i> 重播';
                
                const pauseBtn = document.createElement('button');
                pauseBtn.className = 'btn btn-outline';
                pauseBtn.style.padding = '6px 12px';
                pauseBtn.style.fontSize = '0.95rem';
                pauseBtn.style.borderColor = '#ffb6c1';
                pauseBtn.innerHTML = '<i class="fas fa-pause"></i> 暫停';
                
                card.appendChild(canvasDiv);
                card.appendChild(btnGroup);
                btnGroup.appendChild(animateBtn);
                btnGroup.appendChild(pauseBtn);
                strokeArea.appendChild(card);

                try {
                    const writer = HanziWriter.create(`character-target-${i}`, char, {
                        width: 120,
                        height: 120,
                        padding: 5,
                        strokeAnimationSpeed: strokeAnimationSpeed,
                        delayBetweenStrokes: delayBetweenStrokes,
                        showOutline: true,
                        strokeColor: '#333333',
                        radicalColor: '#e57399'
                    });
                    hanziWriters.push(writer);
                    
                    animateBtn.onclick = () => {
                        writer.cancelQuiz();
                        writer.animateCharacter();
                    };
                    canvasDiv.onclick = () => {
                        writer.cancelQuiz();
                        writer.animateCharacter();
                    };
                    
                    let isPaused = false;
                    pauseBtn.onclick = () => {
                        if (!isPaused) {
                            writer.pauseAnimation();
                            pauseBtn.innerHTML = '<i class="fas fa-play"></i> 繼續';
                            pauseBtn.classList.remove('btn-outline');
                            pauseBtn.classList.add('btn-green');
                            isPaused = true;
                        } else {
                            writer.resumeAnimation();
                            pauseBtn.innerHTML = '<i class="fas fa-pause"></i> 暫停';
                            pauseBtn.classList.remove('btn-green');
                            pauseBtn.classList.add('btn-outline');
                            isPaused = false;
                        }
                    };
                    
                } catch(e) { console.error("HanziWriter Error:", e); }
            }
        }

        document.getElementById('playAudioCantoBtn').onclick = () => speakCantonese(trainingWords[currentTrainIdx]);
        document.getElementById('playAudioMandoBtn').onclick = () => speakMandarin(trainingWords[currentTrainIdx]);
        document.getElementById('prevWordBtn').onclick = () => loadStrokeWord(currentTrainIdx - 1);
        document.getElementById('nextWordBtn').onclick = () => loadStrokeWord(currentTrainIdx + 1);
        
        document.getElementById('addToFavBtn').onclick = () => {
            const word = trainingWords[currentTrainIdx];
            if (!word) return;

            let favGroup = groups.find(g => g.name === "❤️ 我的最愛");
            let isFavorite = favGroup && favGroup.words.includes(word);

            if (isFavorite) {
                favGroup.words = favGroup.words.filter(w => w !== word);
                saveGroups();
                renderGroupPanels();
                showPopup("✨ 成功解鎖！", "小朋友太棒了，已經記住這個詞語囉！");

                if (groups.find(g => g.id === currentGroupId) && groups.find(g => g.id === currentGroupId).name === "❤️ 我的最愛") {
                    trainingWords = favGroup.words;
                    if (trainingWords.length === 0) {
                        setTimeout(() => {
                            showPopup("🎉 恭喜過關！", "最愛清單的詞語都學會囉！");
                            switchView('inputView');
                        }, 1800);
                        return;
                    }
                    if (currentTrainIdx >= trainingWords.length) {
                        currentTrainIdx = Math.max(0, trainingWords.length - 1);
                    }
                    setTimeout(() => loadStrokeWord(currentTrainIdx), 500);
                } else {
                    updateFavBtnUI(word);
                }
            } else {
                if (!favGroup) {
                    const newId = Date.now() + 999;
                    favGroup = {
                        id: newId,
                        name: "❤️ 我的最愛",
                        words: [],
                        articleTitle: "我的最愛詞語",
                        articleContent: "這些是我最喜歡的詞語。"
                    };
                    groups.unshift(favGroup); 
                }
                if (!favGroup.words.includes(word)) {
                    favGroup.words.push(word);
                    saveGroups();
                    renderGroupPanels();
                    showPopup("💖 已加入最愛！", "可以在主選單複習喔！");
                }
                updateFavBtnUI(word);
            }
        };

        document.getElementById('speedSlow').onchange = () => loadStrokeWord(currentTrainIdx);
        document.getElementById('speedNormal').onchange = () => loadStrokeWord(currentTrainIdx);


        // ==================== 模式二：聽音選字遊戲 ====================
        document.getElementById('startGameBtn').onclick = () => {
            const group = groups.find(g => g.id === currentGroupId);
            if(!group || group.words.length < 2) return alert("需要至少 2 個以上的詞語才能玩遊戲喔！");
            gameWordsPool = group.words;
            
            shuffledGameWords = [...gameWordsPool].sort(() => Math.random() - 0.5);
            
            isGaming = true; gameRoundCount = 0;
            switchView('gameView');
            generateGameRound();
        };

        function generateGameRound() {
            if(gameRoundCount >= shuffledGameWords.length) {
                isGaming = false;
                showPopup("🏆 闖關成功！", `恭喜妳通過全部 ${shuffledGameWords.length} 關挑戰！`);
                setTimeout(() => switchView('inputView'), 2000);
                return;
            }
            document.getElementById('gameProgress').innerText = `第 ${gameRoundCount + 1} 關 / 共 ${shuffledGameWords.length} 關`;
            gameTargetWord = shuffledGameWords[gameRoundCount];
            
            let options = [gameTargetWord];
            let distractors = gameWordsPool.filter(w => w !== gameTargetWord).sort(() => Math.random() - 0.5);
            options.push(...distractors.slice(0, 3));
            options.sort(() => Math.random() - 0.5);

            const container = document.getElementById('gameOptionsContainer');
            container.innerHTML = '';
            options.forEach(text => {
                const btn = document.createElement('button');
                btn.className = 'game-option-btn'; btn.innerText = text;
                btn.onclick = () => {
                    if(!isGaming || btn.classList.contains('correct') || btn.classList.contains('wrong')) return;
                    if(text === gameTargetWord) {
                        btn.classList.add('correct'); showPopup("⭐ 答對了！", "聽力一級棒！");
                        isGaming = false;
                        setTimeout(() => { gameRoundCount++; isGaming = true; generateGameRound(); }, 1500);
                    } else {
                        btn.classList.add('wrong');
                        setTimeout(() => btn.classList.remove('wrong'), 500);
                    }
                };
                container.appendChild(btn);
            });
            playGameAudio();
        }
        
        function playGameAudio() {
            if(!isGaming) return;
            const lang = document.querySelector('input[name="gameLang"]:checked').value;
            if(lang === 'canto') speakCantonese(gameTargetWord, null, null, SLOW_RATE_ARTICLE);
            else speakMandarin(gameTargetWord, null, null, SLOW_RATE_ARTICLE);
        }
        document.getElementById('playGameAudioBtn').onclick = playGameAudio;


        // ==================== 模式三：文章逐句閱讀 (動態速度朗讀) ====================
        
        // 速度拉桿文字與數值更新邏輯
        const speedSlider = document.getElementById('speedSlider');
        const speedValueDisplay = document.getElementById('speedValueDisplay');
        speedSlider.addEventListener('input', function() {
            const val = parseFloat(this.value);
            let text = "";
            if (val <= 0.3) text = "(極慢速 🐢)";
            else if (val <= 0.5) text = "(適合學習 👶)";
            else if (val <= 0.8) text = "(正常速度 🚶)";
            else text = "(稍快速度 🐇)";
            speedValueDisplay.innerText = `目前速度: ${val.toFixed(1)} ${text}`;
        });

        document.getElementById('startArticleBtn').onclick = () => {
            const group = groups.find(g => g.id === currentGroupId);
            if(!group || !group.articleContent) return alert('請先在主頁輸入「專屬閱讀文章」內容！');
            
            articleSentences = group.articleContent.match(/[^。！？.!?]+[。！？.!?]*/g) || [group.articleContent];
            articleSentences = articleSentences.map(s => s.trim()).filter(s => s);
            if(articleSentences.length === 0) return;

            currentSentenceIdx = 0;
            document.getElementById('articleReadTitle').innerText = group.articleTitle || group.name;
            switchView('articleView');
            loadArticleSentence();
        };

        function loadArticleSentence() {
            const sentence = articleSentences[currentSentenceIdx];
            document.getElementById('articleProgress').innerText = `句子 ${currentSentenceIdx + 1} / ${articleSentences.length}`;
            
            const displayBox = document.getElementById('articleSentenceDisplay');
            displayBox.innerHTML = '';
            
            const charsData = [];
            for(let i=0; i<sentence.length; i++) {
                const char = sentence[i];
                if(/[\s\p{P}]+/u.test(char)) {
                    displayBox.appendChild(document.createTextNode(char));
                    charsData.push(null);
                } else {
                    const span = document.createElement('span');
                    span.className = 'char-span'; span.innerText = char;
                    span.onclick = () => speakCantonese(char, null, null, SLOW_RATE_CHAR);
                    displayBox.appendChild(span);
                    charsData.push(span);
                }
            }
            displayBox.charsData = charsData;
        }

        // 朗讀廣東話 (依照拉桿速度)
        document.getElementById('speakCantoBtn').onclick = () => {
            const sentence = articleSentences[currentSentenceIdx];
            const charsData = document.getElementById('articleSentenceDisplay').charsData;
            const currentSpeed = parseFloat(speedSlider.value); // 取得當前速度設定
            document.querySelectorAll('.char-span').forEach(s => s.classList.remove('highlight'));
            
            speakCantonese(sentence, (e) => {
                if(e.name === 'word' || e.name === 'character') {
                    if(charsData[e.charIndex]) {
                        document.querySelectorAll('.char-span').forEach(s => s.classList.remove('highlight'));
                        charsData[e.charIndex].classList.add('highlight');
                    }
                }
            }, () => { document.querySelectorAll('.char-span').forEach(s => s.classList.remove('highlight')); }, currentSpeed);
        };

        // 朗讀普通話 (依照拉桿速度)
        document.getElementById('speakMandoBtn').onclick = () => {
            const sentence = articleSentences[currentSentenceIdx];
            const charsData = document.getElementById('articleSentenceDisplay').charsData;
            const currentSpeed = parseFloat(speedSlider.value); // 取得當前速度設定
            document.querySelectorAll('.char-span').forEach(s => s.classList.remove('highlight'));
            
            speakMandarin(sentence, (e) => {
                if(e.name === 'word' || e.name === 'character') {
                    if(charsData[e.charIndex]) {
                        document.querySelectorAll('.char-span').forEach(s => s.classList.remove('highlight'));
                        charsData[e.charIndex].classList.add('highlight');
                    }
                }
            }, () => { document.querySelectorAll('.char-span').forEach(s => s.classList.remove('highlight')); }, currentSpeed);
        };

        document.getElementById('prevArticleBtn').onclick = () => { if(currentSentenceIdx > 0) { currentSentenceIdx--; loadArticleSentence(); } };
        document.getElementById('nextArticleBtn').onclick = () => {
            if(currentSentenceIdx < articleSentences.length - 1) { currentSentenceIdx++; loadArticleSentence(); }
            else { showPopup("📖 閱讀完畢！", "做得太棒了！"); setTimeout(() => switchView('inputView'), 2000); }
        };

        // --- 匯出匯入功能 ---
        document.getElementById('exportDataBtn').onclick = () => {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(groups, null, 2));
            const dl = document.createElement('a'); dl.setAttribute("href", dataStr); dl.setAttribute("download", "欣欣中文學習資料.json");
            document.body.appendChild(dl); dl.click(); dl.remove();
        };
        const fileHidden = document.getElementById('importFileHidden');
        document.getElementById('importDataBtn').onclick = () => fileHidden.click();
        fileHidden.onchange = (e) => {
            const file = e.target.files[0]; if(!file) return;
            const reader = new FileReader();
            reader.onload = (evt) => {
                try {
                    const parsed = JSON.parse(evt.target.result);
                    if(Array.isArray(parsed)) { groups = parsed; currentGroupId = groups[0]?.id; saveGroups(); renderGroupPanels(); selectGroup(currentGroupId); showPopup("📂 匯入成功！", "資料已更新。"); }
                } catch(err) { alert('JSON 格式錯誤！'); }
            };
            reader.readAsText(file);
        };

        // --- 啟動初始化 ---
        window.onload = () => loadGroups();
        window.onbeforeunload = () => synth.cancel();
    })();
</script>
</body>
</html>
