<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>10以內數的分解</title>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap');

        body {
            font-family: 'Nunito', 'Microsoft JhengHei', sans-serif;
            touch-action: manipulation; /* 禁用雙擊放大，優化觸控體驗 */
        }

        /* 錯誤時的震動動畫 */
        .shake {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }
        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
            40%, 60% { transform: translate3d(6px, 0, 0); }
        }

        /* 正確時的彈跳動畫 */
        .success-pop {
            animation: success-pop 0.4s ease-out both;
        }
        @keyframes success-pop {
            0% { transform: scale(1); }
            40% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }

        /* 花邊圓圈的樣式 (模擬紙上的印花) */
        .scalloped-border {
            position: relative;
            background: white;
            border-radius: 50%;
            border: 4px dashed #FBCFE8; /* Tailwind pink-200 */
        }
    </style>
</head>
<body class="bg-pink-50 min-h-screen flex items-center justify-center p-4">
    <div id="root" class="w-full max-w-md"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- 音效系統 (使用 Web Audio API) ---
        let audioContext = null;

        // 初始化 AudioContext (需在使用者互動後才能建立)
        function initAudio() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }
            return audioContext;
        }

        // 播放單一頻率音調
        function playTone(frequency, duration, type = 'sine', volume = 0.3) {
            const ctx = initAudio();
            const now = ctx.currentTime;

            const osc = ctx.createOscillator();
            const gain = ctx.createGain();

            osc.type = type;
            osc.frequency.setValueAtTime(frequency, now);

            gain.gain.setValueAtTime(volume, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

            osc.connect(gain);
            gain.connect(ctx.destination);

            osc.start(now);
            osc.stop(now + duration);
        }

        // 答對音效 – 開心的上揚音
        function playCorrectSound() {
            const ctx = initAudio();
            const now = ctx.currentTime;

            // 兩個連續音：C5 (523Hz) → E5 (659Hz)
            playTone(523, 0.15, 'sine', 0.25);
            setTimeout(() => {
                playTone(659, 0.2, 'sine', 0.25);
            }, 120);
        }

        // 答錯音效 – 低沉的嗡嗡聲
        function playWrongSound() {
            playTone(200, 0.3, 'sawtooth', 0.2);
        }

        // 按鈕點擊音效 – 短促的噠聲
        function playClickSound() {
            const ctx = initAudio();
            const now = ctx.currentTime;
            const duration = 0.05;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();

            osc.type = 'square';
            osc.frequency.setValueAtTime(800, now);
            gain.gain.setValueAtTime(0.15, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            osc.stop(now + duration);
        }

        // --- 主要邏輯 ---
        const generateProblem = () => {
            const total = Math.floor(Math.random() * 9) + 2; // 2 到 10
            const part1 = Math.floor(Math.random() * (total - 1)) + 1; // 1 到 total-1
            const part2 = total - part1;
            const missingIsLeft = Math.random() > 0.5;
            return { total, part1, part2, missingIsLeft };
        };

        const App = () => {
            const [score, setScore] = useState(0);
            const [streak, setStreak] = useState(0);
            const [problem, setProblem] = useState(generateProblem());
            const [inputValue, setInputValue] = useState('');
            const [status, setStatus] = useState('normal'); // 'normal', 'correct', 'wrong'

            const handleInput = (num) => {
                if (status !== 'normal') return;

                // 播放按鍵音效
                playClickSound();

                setInputValue(num);
                const expected = problem.missingIsLeft ? problem.part1 : problem.part2;

                if (num === expected) {
                    setStatus('correct');
                    setScore(s => s + 10);
                    setStreak(s => s + 1);
                    playCorrectSound();

                    setTimeout(() => {
                        setProblem(generateProblem());
                        setInputValue('');
                        setStatus('normal');
                    }, 800);
                } else {
                    setStatus('wrong');
                    setStreak(0);
                    playWrongSound();

                    setTimeout(() => {
                        setInputValue('');
                        setStatus('normal');
                    }, 600);
                }
            };

            const NumberCircle = ({ value, isMissing, currentStatus }) => {
                let circleClasses = "w-24 h-24 flex items-center justify-center rounded-full shadow-md transition-colors duration-200 border-4 ";
                let textClasses = "text-5xl font-black ";

                if (!isMissing) {
                    circleClasses += "bg-white border-pink-200 border-dashed";
                    textClasses += "text-gray-700";
                } else {
                    if (currentStatus === 'normal') {
                        circleClasses += "bg-yellow-50 border-yellow-300 border-solid";
                        textClasses += "text-gray-400";
                    } else if (currentStatus === 'correct') {
                        circleClasses += "bg-green-100 border-green-400 border-solid success-pop";
                        textClasses += "text-green-600";
                    } else if (currentStatus === 'wrong') {
                        circleClasses += "bg-red-100 border-red-400 border-solid shake";
                        textClasses += "text-red-500";
                    }
                }

                return (
                    <div className={circleClasses}>
                        <span className={textClasses}>
                            {value !== '' ? value : '?'}
                        </span>
                    </div>
                );
            };

            return (
                <div className="bg-white rounded-3xl shadow-xl overflow-hidden border-4 border-pink-100">
                    {/* Header */}
                    <div className="bg-pink-100 p-4 text-center relative">
                        <h1 className="text-xl font-bold text-pink-600 tracking-wider">10以內數的分解</h1>
                        <div className="absolute top-4 right-4 flex flex-col items-end">
                            <span className="text-sm font-bold text-pink-500">得分: {score}</span>
                            {streak >= 3 && (
                                <span className="text-xs font-bold text-orange-500 animate-pulse">
                                    連對 {streak} 次! 🔥
                                </span>
                            )}
                        </div>
                    </div>

                    {/* Game Area */}
                    <div className="p-8">
                        <div className="flex flex-col items-center relative w-full max-w-[240px] mx-auto">
                            {/* Top Number */}
                            <div className="z-10 bg-white border-4 border-pink-300 rounded-2xl px-6 py-2 shadow-sm mb-2">
                                <span className="text-6xl font-black text-gray-800">
                                    {problem.total}
                                </span>
                            </div>

                            {/* Connecting Lines SVG */}
                            <svg viewBox="0 0 200 80" className="w-full h-20 z-0 my-[-10px]">
                                <line x1="100" y1="10" x2="30" y2="70" stroke="#FBCFE8" strokeWidth="6" strokeLinecap="round" />
                                <line x1="100" y1="10" x2="170" y2="70" stroke="#FBCFE8" strokeWidth="6" strokeLinecap="round" />
                            </svg>

                            {/* Bottom Numbers */}
                            <div className="flex justify-between w-full z-10 mt-[-10px]">
                                <NumberCircle 
                                    value={problem.missingIsLeft ? inputValue : problem.part1} 
                                    isMissing={problem.missingIsLeft} 
                                    currentStatus={problem.missingIsLeft ? status : 'fixed'} 
                                />
                                <NumberCircle 
                                    value={!problem.missingIsLeft ? inputValue : problem.part2} 
                                    isMissing={!problem.missingIsLeft} 
                                    currentStatus={!problem.missingIsLeft ? status : 'fixed'} 
                                />
                            </div>
                        </div>

                        {/* Instruction text */}
                        <p className="text-center text-gray-500 font-bold mt-8 mb-4">
                            {status === 'correct' ? '答對了！太棒了！' : status === 'wrong' ? '哎呀，再試一次！' : '請選擇正確的數字填入問號中'}
                        </p>

                        {/* Numpad (1-9) */}
                        <div className="grid grid-cols-3 gap-3 w-full max-w-[260px] mx-auto mt-4">
                            {[1, 2, 3, 4, 5, 6, 7, 8, 9].map(num => (
                                <button
                                    key={num}
                                    onClick={() => handleInput(num)}
                                    className="bg-blue-50 hover:bg-blue-100 text-blue-600 border-2 border-blue-200 text-3xl font-black py-4 rounded-2xl shadow-sm active:scale-95 transition-transform duration-100 flex items-center justify-center"
                                >
                                    {num}
                                </button>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
