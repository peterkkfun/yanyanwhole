<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>🎈 欣欣學加減數 · 填充題 ≤10 🎈</title>
    <style>
        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            background: linear-gradient(145deg, #e0f7fa 0%, #b2ebf2 100%);
            color: #333;
            text-align: center;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            user-select: none;
        }

        h1 {
            color: #ff4757;
            font-size: 2.8rem;
            margin: 5px 0 5px;
            text-shadow: 3px 3px #ffeaa7;
            letter-spacing: 2px;
        }

        #game-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(8px);
            padding: 25px 20px 20px;
            border-radius: 48px;
            box-shadow: 0 15px 25px rgba(0,0,0,0.15);
            max-width: 550px;
            width: 90%;
            display: none;
            border: 4px solid #81ecec;
        }

        #start-screen {
            background: white;
            padding: 40px 30px;
            border-radius: 60px;
            box-shadow: 0 20px 30px rgba(0, 184, 148, 0.2);
            border: 4px solid #00b894;
        }

        .progress-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f1f2f6;
            padding: 8px 18px;
            border-radius: 60px;
            margin: 5px 0 15px;
            border: 2px dashed #74b9ff;
            font-weight: bold;
            font-size: 1.4rem;
            color: #0984e3;
        }

        .counter-box {
            background: #ffeaa7;
            padding: 6px 18px;
            border-radius: 40px;
            color: #2d3436;
            box-shadow: inset 0 -3px 0 #fdcb6e;
        }

        .next-reward {
            background: #dfe6e9;
            padding: 6px 16px;
            border-radius: 40px;
            font-size: 1.1rem;
            color: #2d3436;
        }

        .question-box {
            font-size: 4.5rem;
            font-weight: 900;
            color: #00b894;
            margin: 10px 0 15px;
            text-shadow: 4px 4px 0 #c8f7c5;
            letter-spacing: 4px;
            background: #f1f2f6;
            border-radius: 60px;
            padding: 10px;
            line-height: 1.2;
            min-height: 130px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .controls-group {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        .audio-btn, .hint-btn, .layout-btn, .start-btn {
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 1.4rem;
            font-weight: bold;
            padding: 10px 20px;
            cursor: pointer;
            margin: 5px 0;
            transition: 0.08s;
        }

        .audio-btn {
            background-color: #ffa502;
            box-shadow: 0 6px 0 #e67e22;
            border: 2px solid #fff200;
        }
        .audio-btn:active { transform: translateY(6px); box-shadow: 0 0 0 #e67e22; }

        .hint-btn {
            background-color: #a29bfe;
            box-shadow: 0 6px 0 #6c5ce7;
            border: 2px solid #dfe6e9;
        }
        .hint-btn:active { transform: translateY(6px); box-shadow: 0 0 0 #6c5ce7; }

        .layout-btn {
            background-color: #ff7675;
            box-shadow: 0 6px 0 #d63031;
            border: 2px solid #ffeaa7;
        }
        .layout-btn:active { transform: translateY(6px); box-shadow: 0 0 0 #d63031; }

        /* 直式排版專用 CSS */
        .vertical-math {
            display: inline-grid;
            grid-template-columns: auto auto;
            align-items: end;
            justify-content: end;
            letter-spacing: normal;
            line-height: 1.1;
            padding: 10px;
            text-shadow: 3px 3px 0 #c8f7c5;
        }
        .v-num {
            grid-column: 2;
            text-align: right;
        }
        .v-op {
            grid-column: 1;
            text-align: left;
            padding-right: 15px;
        }
        .v-line {
            grid-column: 1 / 3;
            border-bottom: 6px solid #00b894;
            margin: 8px 0;
            width: 100%;
            box-shadow: 0 3px 0 #c8f7c5;
        }
        .v-question {
            color: #ff4757;
        }

        /* 動畫提示區塊 */
        #visual-container {
            background: #fff9c4;
            border: 3px dashed #f39c12;
            border-radius: 25px;
            padding: 15px;
            margin: 10px 0;
            min-height: 80px;
            display: none;
            font-size: 2.2rem;
            text-align: center;
        }

        .hint-text {
            font-size: 1.3rem;
            color: #d35400;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .icons-area {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 5px;
            min-height: 50px;
        }

        .apple-icon {
            display: inline-block;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            transform: scale(0);
            position: relative;
        }

        .box-icon {
            display: inline-block;
            color: #bdc3c7;
            font-size: 2rem;
            animation: fadeIn 0.3s forwards;
        }

        .cross-mark {
            position: absolute;
            left: -5%;
            top: -5%;
            font-size: 2.5rem;
            animation: popIn 0.3s forwards;
        }

        @keyframes popIn {
            0% { transform: scale(0); }
            100% { transform: scale(1); }
        }
        @keyframes fadeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        .options {
            display: flex;
            justify-content: space-around;
            gap: 10px;
            margin: 15px 0 10px;
        }

        .option-btn {
            background-color: #74b9ff;
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 3rem;
            width: 90px;
            height: 90px;
            cursor: pointer;
            box-shadow: 0 8px 0 #0984e3;
            transition: all 0.08s;
            font-weight: bold;
            border: 3px solid white;
        }

        .option-btn:active {
            transform: translateY(8px);
            box-shadow: 0 0 0 #0984e3;
        }

        #banner {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 240, 245, 0.96);
            backdrop-filter: blur(5px);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .banner-text {
            font-size: 6rem;
            color: #ff4757;
            font-weight: bold;
            animation: bounceIn 0.7s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards;
            text-shadow: 6px 6px 0 #ffeaa7;
        }

        .stars {
            font-size: 5rem;
            margin-top: 20px;
            animation: spin 2s linear infinite;
        }

        #reward-banner {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 20% 30%, #f6e58d, #ffb8b8);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1001;
            backdrop-filter: blur(8px);
        }

        .reward-text {
            font-size: 5rem;
            font-weight: 900;
            color: #b71540;
            text-shadow: 5px 5px 0 #f8c291;
            animation: popReward 0.8s ease-out forwards;
            background: rgba(255,255,240,0.5);
            padding: 20px 30px;
            border-radius: 120px;
            border: 6px solid gold;
            box-shadow: 0 20px 30px rgba(0,0,0,0.2);
            text-align: center;
        }

        .reward-sub {
            font-size: 2.5rem;
            margin: 20px 0;
            color: #2c3e50;
            font-weight: bold;
            animation: float 1.2s infinite alternate;
        }

        .reward-stars {
            font-size: 5rem;
            display: flex;
            gap: 20px;
        }

        @keyframes popReward {
            0% { transform: scale(0.2) rotate(-10deg); opacity: 0; }
            80% { transform: scale(1.1) rotate(2deg); }
            100% { transform: scale(1) rotate(0); opacity: 1; }
        }

        @keyframes float {
            from { transform: translateY(0px); }
            to { transform: translateY(-15px); }
        }

        @keyframes bounceIn {
            0% { transform: scale(0.1); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .shake {
            animation: shake 0.3s;
            background-color: #ff7675 !important;
            box-shadow: 0 8px 0 #d63031 !important;
        }

        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            50% { transform: translateX(10px); }
            75% { transform: translateX(-10px); }
            100% { transform: translateX(0); }
        }

        #confetti-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1002;
            display: none;
        }

        .start-btn {
            font-size: 2rem;
            padding: 18px 40px;
            background: #00b894;
            box-shadow: 0 9px 0 #00b894;
        }

        .footer-note {
            margin-top: 5px;
            color: #e84393;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>

    <!-- 開始畫面 -->
    <div id="start-screen">
        <h1>🧸 欣欣學加減數</h1>
        <p style="font-size: 1.6rem; color: #6c5ce7;">➕ ➖ 填充題 · 數字 ≤ 10</p>
        <p style="font-size: 1.4rem; color: #e84393;">⭐ 每10題有驚喜動畫 ⭐</p>
        <button class="start-btn" onclick="startGame()">🎯 開始遊戲 🎯</button>
    </div>

    <!-- 主要遊戲區 -->
    <div id="game-container">
        <h1>✨ 欣欣學加減 ✨</h1>
        
        <div class="progress-area">
            <span class="counter-box">✅ 完成: <span id="question-counter">0</span> 題</span>
            <span class="next-reward">🎁 獎勵: <span id="next-milestone">10</span></span>
        </div>

        <div class="controls-group">
            <button class="audio-btn" onclick="speakQuestion()">🔊 聽讀音</button>
            <button class="hint-btn" onclick="playHintAnimation()">💡 睇動畫</button>
            <!-- 排版切換按鈕 -->
            <button class="layout-btn" id="layout-btn" onclick="toggleLayout()">📐 模式：隨機</button>
        </div>

        <!-- 視覺化動畫區域 -->
        <div id="visual-container">
            <div class="hint-text" id="hint-text"></div>
            <div class="icons-area" id="icons-area"></div>
        </div>

        <!-- 題目顯示區 -->
        <div class="question-box" id="question-display"></div>
        
        <div class="options" id="options-container"></div>
        <div class="footer-note">㊗️ 撳答案啦～</div>
    </div>

    <!-- 普通答對橫幅 -->
    <div id="banner">
        <div class="banner-text">欣欣叻叻</div>
        <div class="stars">🌟👧🏻🌟</div>
    </div>

    <!-- 10題獎勵專屬動畫橫幅 -->
    <div id="reward-banner">
        <div class="reward-text" id="reward-text-display">🎉 10題達成 🎉</div>
        <div class="reward-sub">欣欣好犀利呀！</div>
        <div class="reward-stars">
            <span>🏆</span><span>🌟</span><span>👑</span><span>🌟</span><span>🏆</span>
        </div>
        <div style="margin-top: 30px; font-size: 2.2rem; color:#2c3e50;">繼續加油～</div>
    </div>

    <!-- 彩帶動畫canvas -->
    <canvas id="confetti-canvas"></canvas>

    <script>
        (function(){
            // ---------- 遊戲狀態 ----------
            let questionText = '';
            let correctAnswer = 0;
            let isProcessing = false;
            let correctCount = 0;
            const MILESTONE = 10;   // 為了保持小朋友興趣，降為每10題獎勵一次
            
            // 排版模式：'horizontal' (橫式), 'vertical' (直式), 'random' (隨機)
            let displayMode = 'random'; 
            
            // 儲存當前題目的詳細數值供動畫與排版使用
            let currentQ = { type: 0, a: 0, b: 0, c: 0, ans: 0 };
            
            // 動畫狀態控制
            let isAnimatingHint = false;
            let animationSessionId = 0;
            const sleep = ms => new Promise(r => setTimeout(r, ms));

            // DOM 元素
            const startScreen = document.getElementById('start-screen');
            const gameContainer = document.getElementById('game-container');
            const questionDisplay = document.getElementById('question-display');
            const optionsContainer = document.getElementById('options-container');
            const visualContainer = document.getElementById('visual-container');
            const hintText = document.getElementById('hint-text');
            const iconsArea = document.getElementById('icons-area');
            const banner = document.getElementById('banner');
            const rewardBanner = document.getElementById('reward-banner');
            const rewardTextDisplay = document.getElementById('reward-text-display');
            const counterSpan = document.getElementById('question-counter');
            const nextMilestoneSpan = document.getElementById('next-milestone');
            const confettiCanvas = document.getElementById('confetti-canvas');
            const layoutBtn = document.getElementById('layout-btn');
            let ctx = confettiCanvas.getContext('2d');

            let animationId = null;
            let particles = [];

            // ---------- 切換排版模式 ----------
            window.toggleLayout = function() {
                if (displayMode === 'random') {
                    displayMode = 'horizontal';
                    layoutBtn.innerText = '📐 模式：橫式';
                } else if (displayMode === 'horizontal') {
                    displayMode = 'vertical';
                    layoutBtn.innerText = '📐 模式：直式';
                } else {
                    displayMode = 'random';
                    layoutBtn.innerText = '📐 模式：隨機';
                }
                renderQuestionDisplay();
            };

            // ---------- 更新計數器 ----------
            function updateCounterUI() {
                counterSpan.textContent = correctCount;
                let next = Math.ceil(correctCount / MILESTONE) * MILESTONE;
                if (correctCount % MILESTONE === 0 && correctCount > 0) {
                    next = correctCount + MILESTONE;
                }
                if (next === 0) next = MILESTONE;
                nextMilestoneSpan.textContent = next;
            }

            // ---------- 開始遊戲 ----------
            window.startGame = function() {
                correctCount = 0;
                updateCounterUI();
                
                startScreen.style.display = 'none';
                gameContainer.style.display = 'block';
                banner.style.display = 'none';
                rewardBanner.style.display = 'none';
                stopConfetti(); 
                
                nextQuestion();
            };

            // ---------- 隨機生成填充題 (限制在 10 以內) ----------
            function nextQuestion() {
                isProcessing = false;
                
                // 重置並隱藏提示動畫
                animationSessionId++;
                isAnimatingHint = false;
                visualContainer.style.display = 'none';
                iconsArea.innerHTML = '';
                hintText.innerText = '';

                // 隨機選擇題型 0~6
                const type = Math.floor(Math.random() * 7);

                switch(type) {
                    case 0: generateStandardAddition(); break;
                    case 1: generateAdditionMissingFirst(); break;
                    case 2: generateAdditionMissingSecond(); break;
                    case 3: generateStandardSubtraction(); break;
                    case 4: generateSubtractionMissingMinuend(); break;
                    case 5: generateSubtractionMissingSubtrahend(); break;
                    case 6: generateTripleAddition(); break;
                }

                // 更新畫面顯示
                renderQuestionDisplay();
                generateOptions();

                // 自動讀題（略延遲）
                setTimeout(() => {
                    if (!isProcessing) speakQuestion();
                }, 300);
            }

            // ---------- 各題型生成器 ----------
            function generateStandardAddition() {
                currentQ.type = 0;
                currentQ.a = Math.floor(Math.random() * 11);
                currentQ.b = Math.floor(Math.random() * (11 - currentQ.a));
                currentQ.ans = currentQ.a + currentQ.b;
                questionText = `${currentQ.a} + ${currentQ.b} = ?`;
                correctAnswer = currentQ.ans;
            }

            function generateAdditionMissingFirst() {
                currentQ.type = 1;
                currentQ.ans = Math.floor(Math.random() * 11); // ? 的值
                currentQ.b = Math.floor(Math.random() * (11 - currentQ.ans));
                currentQ.c = currentQ.ans + currentQ.b;
                questionText = `? + ${currentQ.b} = ${currentQ.c}`;
                correctAnswer = currentQ.ans;
            }

            function generateAdditionMissingSecond() {
                currentQ.type = 2;
                currentQ.a = Math.floor(Math.random() * 11);
                currentQ.ans = Math.floor(Math.random() * (11 - currentQ.a)); // ? 的值
                currentQ.c = currentQ.a + currentQ.ans;
                questionText = `${currentQ.a} + ? = ${currentQ.c}`;
                correctAnswer = currentQ.ans;
            }

            function generateStandardSubtraction() {
                currentQ.type = 3;
                currentQ.a = Math.floor(Math.random() * 11);
                currentQ.b = Math.floor(Math.random() * (currentQ.a + 1));
                currentQ.ans = currentQ.a - currentQ.b;
                questionText = `${currentQ.a} - ${currentQ.b} = ?`;
                correctAnswer = currentQ.ans;
            }

            function generateSubtractionMissingMinuend() {
                currentQ.type = 4;
                currentQ.ans = Math.floor(Math.random() * 11); // 原本總數 (被減數)
                currentQ.b = Math.floor(Math.random() * (currentQ.ans + 1));
                currentQ.c = currentQ.ans - currentQ.b;
                questionText = `? - ${currentQ.b} = ${currentQ.c}`;
                correctAnswer = currentQ.ans;
            }

            function generateSubtractionMissingSubtrahend() {
                currentQ.type = 5;
                currentQ.a = Math.floor(Math.random() * 11); // 原本總數
                currentQ.ans = Math.floor(Math.random() * (currentQ.a + 1)); // 減去的數
                currentQ.c = currentQ.a - currentQ.ans;
                questionText = `${currentQ.a} - ? = ${currentQ.c}`;
                correctAnswer = currentQ.ans;
            }

            function generateTripleAddition() {
                currentQ.type = 6;
                currentQ.a = Math.floor(Math.random() * 11);      
                currentQ.b = Math.floor(Math.random() * (11 - currentQ.a)); 
                currentQ.c = Math.floor(Math.random() * (11 - currentQ.a - currentQ.b));
                currentQ.ans = currentQ.a + currentQ.b + currentQ.c;
                questionText = `${currentQ.a} + ${currentQ.b} + ${currentQ.c} = ?`;
                correctAnswer = currentQ.ans;
            }

            // ---------- 渲染題目顯示 (處理橫/直式邏輯) ----------
            function renderQuestionDisplay() {
                let mode = displayMode;
                if (mode === 'random') {
                    // 隨機選取橫式或直式
                    mode = Math.random() > 0.5 ? 'horizontal' : 'vertical';
                }

                if (mode === 'horizontal') {
                    // 橫式渲染
                    let horizontalHTML = questionText
                        .replace(/\?/g, '<span class="v-question">?</span>')
                        .replace(/-/g, '−'); // 換成好看一點的減號
                    questionDisplay.innerHTML = horizontalHTML;
                } else {
                    // 直式渲染
                    questionDisplay.innerHTML = buildVerticalHTML(currentQ);
                }
            }

            // ---------- 建立直式的 HTML ----------
            function buildVerticalHTML(q) {
                let op = (q.type >= 3 && q.type <= 5) ? '−' : '+';
                let html = '<div class="vertical-math">';
                
                const formatVal = (v) => v === '?' ? '<span class="v-question">?</span>' : v;
                
                let row1, row2, row3, row4;
                if (q.type === 0) { row1 = q.a; row2 = q.b; row3 = '?'; }
                else if (q.type === 1) { row1 = '?'; row2 = q.b; row3 = q.c; }
                else if (q.type === 2) { row1 = q.a; row2 = '?'; row3 = q.c; }
                else if (q.type === 3) { row1 = q.a; row2 = q.b; row3 = '?'; op = '−'; }
                else if (q.type === 4) { row1 = '?'; row2 = q.b; row3 = q.c; op = '−'; }
                else if (q.type === 5) { row1 = q.a; row2 = '?'; row3 = q.c; op = '−'; }
                else if (q.type === 6) { row1 = q.a; row2 = q.b; row4 = q.c; row3 = '?'; op = '+'; }

                // 處理三個數字相加 (題型6) 與 一般兩個數字的情況
                if (q.type === 6) {
                    html += `<div class="v-op"></div><div class="v-num">${formatVal(row1)}</div>`;
                    html += `<div class="v-op">${op}</div><div class="v-num">${formatVal(row2)}</div>`;
                    html += `<div class="v-op">${op}</div><div class="v-num">${formatVal(row4)}</div>`;
                } else {
                    html += `<div class="v-op"></div><div class="v-num">${formatVal(row1)}</div>`;
                    html += `<div class="v-op">${op}</div><div class="v-num">${formatVal(row2)}</div>`;
                }
                
                html += `<div class="v-line"></div>`;
                html += `<div class="v-op"></div><div class="v-num">${formatVal(row3)}</div>`;
                html += '</div>';
                return html;
            }

            // 產生3個選項（正確答案加兩個錯誤選項，範圍0~10）
            function generateOptions() {
                let options = [correctAnswer];
                while (options.length < 3) {
                    let wrong = Math.floor(Math.random() * 11); // 只產生 0~10
                    if (!options.includes(wrong)) options.push(wrong);
                }
                options.sort(() => Math.random() - 0.5);

                optionsContainer.innerHTML = '';
                options.forEach(opt => {
                    let btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.innerText = opt;
                    btn.onclick = (e) => checkAnswer(opt, btn);
                    optionsContainer.appendChild(btn);
                });
            }

            // ---------- 視覺化動畫提示 ----------
            window.playHintAnimation = async function() {
                if (isAnimatingHint || isProcessing) return;
                isAnimatingHint = true;
                
                let session = animationSessionId;
                visualContainer.style.display = 'block';
                iconsArea.innerHTML = '';
                
                let q = currentQ;
                
                try {
                    switch(q.type) {
                        case 0: // a + b = ans
                            hintText.innerText = `先放 ${q.a} 個蘋果🍎`;
                            for(let i=0; i<q.a; i++) {
                                if (session !== animationSessionId) return;
                                iconsArea.innerHTML += `<span class="apple-icon">🍎</span>`;
                                await sleep(300);
                            }
                            if(q.b > 0) {
                                await sleep(400);
                                if (session !== animationSessionId) return;
                                hintText.innerText = `再加 ${q.b} 個青蘋果🍏`;
                                for(let i=0; i<q.b; i++) {
                                    if (session !== animationSessionId) return;
                                    iconsArea.innerHTML += `<span class="apple-icon">🍏</span>`;
                                    await sleep(300);
                                }
                            }
                            await sleep(400);
                            if (session !== animationSessionId) return;
                            hintText.innerText = `一共有幾多個呢？數數看！`;
                            break;
                            
                        case 3: // a - b = ans
                            hintText.innerText = `原本有 ${q.a} 個蘋果🍎`;
                            for(let i=0; i<q.a; i++) {
                                if (session !== animationSessionId) return;
                                iconsArea.innerHTML += `<span class="apple-icon" id="apple-${i}">🍎</span>`;
                                await sleep(300);
                            }
                            if(q.b > 0) {
                                await sleep(500);
                                if (session !== animationSessionId) return;
                                hintText.innerText = `食咗 ${q.b} 個❌`;
                                for(let i=0; i<q.b; i++) {
                                    if (session !== animationSessionId) return;
                                    let idx = q.a - 1 - i;
                                    let apple = document.getElementById(`apple-${idx}`);
                                    if(apple) {
                                        apple.innerHTML += `<span class="cross-mark">❌</span>`;
                                        apple.style.opacity = '0.5';
                                    }
                                    await sleep(300);
                                }
                            }
                            await sleep(500);
                            if (session !== animationSessionId) return;
                            hintText.innerText = `仲剩幾多個好嘅蘋果？`;
                            break;
                            
                        case 1: // ? + b = c 
                            hintText.innerText = `目標要有 ${q.c} 個，後面已有 ${q.b} 個🍏`;
                            for(let i=0; i<q.c; i++) {
                                if (session !== animationSessionId) return;
                                if(i >= q.ans) { 
                                    iconsArea.innerHTML += `<span class="apple-icon">🍏</span>`;
                                } else {
                                    iconsArea.innerHTML += `<span class="box-icon">🔲</span>`;
                                }
                                await sleep(200);
                            }
                            await sleep(500);
                            if (session !== animationSessionId) return;
                            hintText.innerText = `前面空格仲差幾多個蘋果呢？`;
                            break;
                            
                        case 2: // a + ? = c
                            hintText.innerText = `目標要有 ${q.c} 個，前面已有 ${q.a} 個🍎`;
                            for(let i=0; i<q.c; i++) {
                                if (session !== animationSessionId) return;
                                if(i < q.a) { 
                                    iconsArea.innerHTML += `<span class="apple-icon">🍎</span>`;
                                } else {
                                    iconsArea.innerHTML += `<span class="box-icon">🔲</span>`;
                                }
                                await sleep(200);
                            }
                            await sleep(500);
                            if (session !== animationSessionId) return;
                            hintText.innerText = `後面空格仲差幾多個蘋果呢？`;
                            break;
                            
                        case 4: // ? - b = c 
                            hintText.innerText = `食咗 ${q.b} 個❌，仲剩 ${q.c} 個🍏`;
                            for(let i=0; i<q.b; i++) {
                                if (session !== animationSessionId) return;
                                iconsArea.innerHTML += `<span class="apple-icon" style="opacity:0.5">🍎<span class="cross-mark">❌</span></span>`;
                                await sleep(250);
                            }
                            for(let i=0; i<q.c; i++) {
                                if (session !== animationSessionId) return;
                                iconsArea.innerHTML += `<span class="apple-icon">🍏</span>`;
                                await sleep(250);
                            }
                            await sleep(500);
                            if (session !== animationSessionId) return;
                            hintText.innerText = `將全部加埋，原本一共有幾多個？`;
                            break;
                            
                        case 5: // a - ? = c
                            hintText.innerText = `原本有 ${q.a} 個蘋果🍎`;
                            for(let i=0; i<q.a; i++) {
                                if (session !== animationSessionId) return;
                                iconsArea.innerHTML += `<span class="apple-icon" id="apple5-${i}">🍎</span>`;
                                await sleep(250);
                            }
                            await sleep(500);
                            if (session !== animationSessionId) return;
                            hintText.innerText = `最後淨返 ${q.c} 個好嘅，幫你圈起佢地`;
                            for(let i=0; i<q.c; i++) {
                                if (session !== animationSessionId) return;
                                let apple = document.getElementById(`apple5-${i}`);
                                if(apple) {
                                    apple.style.borderBottom = "5px solid #2ed573";
                                    apple.style.borderRadius = "50%";
                                }
                                await sleep(250);
                            }
                            await sleep(500);
                            if (session !== animationSessionId) return;
                            hintText.innerText = `冇圈起嘅就係俾人食咗啦！數下有幾多個？`;
                            break;
                            
                        case 6: // a + b + c = ans
                            hintText.innerText = `先放 ${q.a} 個🍎，再加 ${q.b} 個🍏`;
                            for(let i=0; i<q.a; i++) { if (session !== animationSessionId) return; iconsArea.innerHTML += `<span class="apple-icon">🍎</span>`; await sleep(200); }
                            if(q.b > 0) {
                                iconsArea.innerHTML += `<span style="margin:0 5px; font-size:1.5rem; color:#888;">+</span>`;
                                for(let i=0; i<q.b; i++) { if (session !== animationSessionId) return; iconsArea.innerHTML += `<span class="apple-icon">🍏</span>`; await sleep(200); }
                            }
                            if(q.c > 0) {
                                await sleep(400);
                                if (session !== animationSessionId) return;
                                hintText.innerText = `最後再加 ${q.c} 個🍊`;
                                iconsArea.innerHTML += `<span style="margin:0 5px; font-size:1.5rem; color:#888;">+</span>`;
                                for(let i=0; i<q.c; i++) { if (session !== animationSessionId) return; iconsArea.innerHTML += `<span class="apple-icon">🍊</span>`; await sleep(200); }
                            }
                            await sleep(500);
                            if (session !== animationSessionId) return;
                            hintText.innerText = `數下全部加埋有幾多個？`;
                            break;
                    }
                } catch(e) { console.error(e); } 
                
                isAnimatingHint = false;
            };

            // ---------- 語音：粵語 + 英式英語 ----------
            window.speakQuestion = function() {
                if (isProcessing) return;
                window.speechSynthesis.cancel();

                // 朗讀字眼依舊根據原本字串
                const cantoText = questionText
                    .replace(/\?/g, '幾多')
                    .replace(/\+/g, '加')
                    .replace(/-/g, '減')
                    .replace(/=/g, '等於');
                const cantoUtter = new SpeechSynthesisUtterance(cantoText);
                cantoUtter.lang = 'zh-HK';
                cantoUtter.rate = 0.85;

                const engText = questionText
                    .replace(/\?/g, 'what')
                    .replace(/\+/g, 'plus')
                    .replace(/-/g, 'minus')
                    .replace(/=/g, 'equals');
                const engUtter = new SpeechSynthesisUtterance(engText);
                engUtter.lang = 'en-GB';
                engUtter.rate = 0.85;

                window.speechSynthesis.speak(cantoUtter);
                window.speechSynthesis.speak(engUtter);
            };

            // ---------- 檢查答案 ----------
            function checkAnswer(selected, buttonElement) {
                if (isProcessing) return;

                if (selected === correctAnswer) {
                    isProcessing = true;
                    // 中斷進行中的動畫
                    animationSessionId++; 
                    
                    correctCount++;
                    updateCounterUI();

                    if (correctCount % MILESTONE === 0 && correctCount > 0) {
                        showRewardAnimation();
                    } else {
                        showSuccessBanner();
                    }
                } else {
                    buttonElement.classList.add('shake');
                    setTimeout(() => buttonElement.classList.remove('shake'), 350);
                }
            }

            // ---------- 普通成功橫幅 ----------
            function showSuccessBanner() {
                window.speechSynthesis.cancel();
                
                banner.style.display = 'flex';
                
                let successUtter = new SpeechSynthesisUtterance("欣欣叻叻！");
                successUtter.lang = 'zh-HK';
                successUtter.rate = 0.9;
                window.speechSynthesis.speak(successUtter);

                setTimeout(() => {
                    banner.style.display = 'none';
                    nextQuestion();
                }, 2500);
            }

            // ---------- 精彩獎勵動畫 (10題倍數) ----------
            function showRewardAnimation() {
                window.speechSynthesis.cancel();
                
                rewardTextDisplay.innerText = `🎉 ${correctCount}題達成 🎉`;
                rewardBanner.style.display = 'flex';
                startConfetti();

                let rewardUtter = new SpeechSynthesisUtterance(`好犀利！你已經完成${correctCount}題啦！繼續加油！`);
                rewardUtter.lang = 'zh-HK';
                rewardUtter.rate = 0.9;
                window.speechSynthesis.speak(rewardUtter);

                setTimeout(() => {
                    rewardBanner.style.display = 'none';
                    stopConfetti();
                    nextQuestion();
                }, 3800);
            }

            // ---------- 彩帶特效 ----------
            function startConfetti() {
                confettiCanvas.style.display = 'block';
                resizeCanvas();
                window.addEventListener('resize', resizeCanvas);
                
                particles = [];
                for (let i = 0; i < 140; i++) {
                    particles.push({
                        x: Math.random() * confettiCanvas.width,
                        y: Math.random() * confettiCanvas.height * 0.2 - 50,
                        size: Math.random() * 12 + 6,
                        speedY: Math.random() * 6 + 4,
                        speedX: (Math.random() - 0.5) * 3,
                        color: `hsl(${Math.random() * 360}, 90%, 60%)`,
                        rotation: Math.random() * 360,
                        rotationSpeed: (Math.random() - 0.5) * 8
                    });
                }
                
                function draw() {
                    if (!confettiCanvas || confettiCanvas.style.display === 'none') return;
                    
                    ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
                    
                    let stillActive = false;
                    for (let p of particles) {
                        p.y += p.speedY;
                        p.x += p.speedX;
                        p.rotation += p.rotationSpeed;
                        
                        if (p.y > confettiCanvas.height + 50) {
                            p.y = -30;
                            p.x = Math.random() * confettiCanvas.width;
                        }
                        if (p.x < -50) p.x = confettiCanvas.width + 20;
                        if (p.x > confettiCanvas.width + 50) p.x = -20;
                        
                        ctx.save();
                        ctx.translate(p.x, p.y);
                        ctx.rotate(p.rotation * Math.PI / 180);
                        ctx.fillStyle = p.color;
                        ctx.fillRect(-p.size/2, -p.size/4, p.size, p.size/1.8);
                        ctx.restore();
                        
                        stillActive = true;
                    }
                    
                    if (stillActive) {
                        animationId = requestAnimationFrame(draw);
                    }
                }
                
                animationId = requestAnimationFrame(draw);
            }

            function stopConfetti() {
                if (animationId) {
                    cancelAnimationFrame(animationId);
                    animationId = null;
                }
                confettiCanvas.style.display = 'none';
                ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
                window.removeEventListener('resize', resizeCanvas);
            }

            function resizeCanvas() {
                confettiCanvas.width = window.innerWidth;
                confettiCanvas.height = window.innerHeight;
            }

            window.addEventListener('beforeunload', function() {
                if (animationId) cancelAnimationFrame(animationId);
            });

            stopConfetti();
            updateCounterUI();
        })();
    </script>
</body>
